<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>REVE AI Dictionary & Translator</title>

    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#16a085">
    <link rel="apple-touch-icon" href="assets/logos/index_logo.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="প্রবাসী সেবা">
    <link rel="icon" type="image/png" href="assets/logos/index_logo.png">

    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

    <style>
        :root {
            --bg-color: #eef2f5;
            --container-bg: #ffffff;
            --text-color: #333333;
            --subtext-color: #555555;
            --border-color: #e2e8f0;
            --card-bg: #f8f9fa;
            --input-bg: #ffffff;
            --input-border: #dddddd;
            --result-bg: #f9f9f9;
            --btn-icon-bg: #f0f0f0;
            --btn-icon-text: #333333;
        }

        [data-theme="dark"] {
            --bg-color: #121212;
            --container-bg: #1e1e1e;
            --text-color: #e0e0e0;
            --subtext-color: #a0a0a0;
            --border-color: #333333;
            --card-bg: #2a2a2a;
            --input-bg: #2d2d2d;
            --input-border: #444444;
            --result-bg: #252525;
            --btn-icon-bg: #333333;
            --btn-icon-text: #ffffff;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; transition: background-color 0.2s ease, color 0.2s ease; }
        body { background-color: var(--bg-color); color: var(--text-color); padding: 15px; display: flex; justify-content: center; align-items: center; min-height: 100vh; flex-direction: column; }
        .app-container { background: var(--container-bg); padding: 20px; border-radius: 20px; box-shadow: 0 8px 25px rgba(0,0,0,0.2); width: 100%; max-width: 440px; overflow: hidden; }
        
        .hero-banner { text-align: center; background: linear-gradient(135deg, #0b874b, #16a085); color: white; padding: 18px 15px; border-radius: 16px; margin-bottom: 15px; position: relative; }
        .hero-banner h1 { font-size: 24px; font-weight: 800; letter-spacing: 0.5px; margin-bottom: 4px; }
        .hero-banner h1 span { font-size: 16px; color: #f1c40f; font-style: italic; }
        .hero-banner p { font-size: 13px; opacity: 0.95; font-weight: 500; }
        .theme-toggle-btn { position: absolute; top: 12px; right: 12px; background: rgba(255,255,255,0.2); border: none; color: white; font-size: 16px; border-radius: 50%; width: 32px; height: 32px; cursor: pointer; display: flex; align-items: center; justify-content: center; }

        .translation-direction { 
            display: flex; align-items: center; justify-content: center; 
            background: var(--card-bg); padding: 10px; border-radius: 12px; 
            margin-bottom: 15px; border: 1px solid var(--border-color); gap: 8px; width: 100%;
        }
        .lang-select-box { display: flex; flex-direction: column; align-items: center; justify-content: center; flex: 1; min-width: 0; }
        .lang-select-box label { font-size: 11px; font-weight: bold; color: #16a085; margin-bottom: 4px; text-align: center; white-space: nowrap; }
        .lang-select { width: 100%; padding: 6px 4px; border-radius: 6px; border: 1px solid #16a085; font-size: 12px; font-weight: bold; outline: none; background: var(--input-bg); color: var(--text-color); cursor: pointer; text-align: center; text-align-last: center; }
        .swap-btn { background: #16a085; color: white; border: none; border-radius: 50%; width: 32px; height: 32px; font-size: 14px; cursor: pointer; display: flex; align-items: center; justify-content: center; margin-top: 14px; flex-shrink: 0; }

        .search-container { display: flex; flex-direction: column; gap: 8px; margin-bottom: 15px; }
        .search-input-group { display: flex; gap: 6px; align-items: center; }
        input[type="text"] { flex: 1; padding: 10px; font-size: 13px; border: 2px solid var(--input-border); background: var(--input-bg); color: var(--text-color); border-radius: 8px; outline: none; }

        .icon-btn { background: var(--btn-icon-bg); color: var(--btn-icon-text); border: 1px solid var(--border-color); padding: 8px 10px; border-radius: 8px; cursor: pointer; font-size: 13px; display: flex; align-items: center; justify-content: center; gap: 4px; font-weight: bold; }
        .icon-btn:hover { opacity: 0.9; }

        button.action-btn { background: #27ae60; color: white; border: none; padding: 10px 12px; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 13px; }
        .speak-btn { background: #3498db; color: white; border: none; padding: 4px 8px; border-radius: 6px; cursor: pointer; font-size: 11px; margin-left: 6px; display: inline-flex; align-items: center; justify-content: center; gap: 3px; }
        .speak-btn-speaker { background: #e74c3c; color: white; border: none; border-radius: 50%; width: 32px; height: 32px; cursor: pointer; display: flex; align-items: center; justify-content: center; }

        .result-card { background: var(--result-bg); padding: 15px; border-radius: 10px; border-left: 4px solid #27ae60; min-height: 80px; margin-bottom: 15px; line-height: 1.6; color: var(--text-color); }

        .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.8); color: white; padding: 8px 16px; border-radius: 20px; font-size: 12px; display: none; z-index: 1000; }
    </style>
</head>
<body>

<div class="app-container">
    <div id="toast" class="toast">কপি করা হয়েছে! 📋</div>

    <div class="hero-banner">
        <button class="theme-toggle-btn" onclick="toggleDarkMode()" id="themeToggleBtn">🌙</button>
        <h1>REVE AI <span>Apps</span></h1>
        <p>AI দিয়ে সহজে ইংরেজি শিখুন ও অনুবাদ করুন</p>
    </div>

    <div class="translation-direction">
        <div class="lang-select-box">
            <label for="sourceLang">থেকে (From):</label>
            <select id="sourceLang" class="lang-select">
                <option value="auto" selected>🌐 Auto Detect</option>
                <option value="en">English</option>
                <option value="bn">Bangla (বাংলা)</option>
            </select>
        </div>

        <button class="swap-btn" onclick="swapLanguages()">⇄</button>

        <div class="lang-select-box">
            <label for="targetLang">অনুবাদ (To):</label>
            <select id="targetLang" class="lang-select">
                <option value="bn" selected>Bangla (বাংলা)</option>
                <option value="en">English</option>
            </select>
        </div>
    </div>

    <div id="dictSection">
        <div class="search-container">
            <div class="search-input-group">
                <input type="text" id="wordInput" placeholder="শব্দ বা বাক্য লিখুন (যেমন: AMI FENI JABO)" onkeypress="if(event.key==='Enter') searchWord()">
            </div>
            <div class="search-input-group">
                <button id="micBtn" class="icon-btn" onclick="startVoiceSearch()">🎙️ কথা বলুন</button>
                <button class="icon-btn" onclick="document.getElementById('imageInput').click()">📷 স্ক্যান</button>
                <input type="file" id="imageInput" accept="image/*" style="display: none;" onchange="processImageSearch(event)">
                <button class="action-btn" style="flex:1;" onclick="searchWord()">খুঁজুন</button>
            </div>
        </div>
        <div id="resultContainer" class="result-card">
            <p style="color: var(--subtext-color); text-align: center; font-size: 12px;">শব্দ বা বাক্য লিখুন, অনুবাদ দেখতে পাবেন</p>
        </div>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
