<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>শব্দকোষ ও কুইজ একাডেমি</title>

    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#2ecc71">
    <link rel="apple-touch-icon" href="assets/logos/index_logo.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="ডিকুইজ অ্যাপ">
    <link rel="icon" type="image/png" href="assets/logos/index_logo.png">

    <!-- Fast OCR Engine for Image Text Reading -->
    <script src="https://unpkg.com/tesseract.js@v2.1.0/dist/tesseract.min.js"></script>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #f0f4f8; color: #333; padding: 15px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .app-container { background: #fff; padding: 20px; border-radius: 20px; box-shadow: 0 6px 20px rgba(0,0,0,0.1); width: 100%; max-width: 400px; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; background: #2ecc71; color: white; padding: 12px 15px; border-radius: 12px; }
        .stats { font-size: 14px; font-weight: bold; }
        .tabs { display: flex; gap: 10px; margin-bottom: 20px; }
        .tab-btn { flex: 1; padding: 10px; border: none; background: #e0e0e0; border-radius: 8px; cursor: pointer; font-weight: bold; transition: 0.3s; }
        .tab-btn.active { background: #3498db; color: white; }
        .section { display: none; }
        .section.active { display: block; }
        
        .search-box { display: flex; gap: 6px; margin-bottom: 15px; align-items: center; }
        input { flex: 1; padding: 10px; font-size: 14px; border: 2px solid #ddd; border-radius: 8px; outline: none; }
        .icon-btn { background: #f0f0f0; border: 1px solid #ccc; padding: 8px 10px; border-radius: 8px; cursor: pointer; font-size: 16px; display: flex; align-items: center; justify-content: center; }
        .icon-btn:hover { background: #e0e0e0; }
        .icon-btn.listening { background: #e74c3c; color: white; animation: pulse 1s infinite; }
        
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        button.action-btn { background: #3498db; color: white; border: none; padding: 10px 12px; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 14px; }
        
        .result-card { background: #f9f9f9; padding: 12px; border-radius: 8px; border-left: 4px solid #3498db; min-height: 90px; margin-bottom: 15px; }
        .quiz-card { background: #fff9c4; padding: 15px; border-radius: 10px; margin-bottom: 15px; text-align: center; }
        .options-grid { display: grid; gap: 8px; }
        .opt-btn { padding: 10px; background: white; border: 2px solid #fbc02d; border-radius: 8px; cursor: pointer; font-size: 15px; text-align: center; font-weight: bold; }
        .opt-btn:hover { background: #fffde7; }
    </style>
</head>
<body>

<div class="app-container">
    <div class="header">
        <span>🔥 ডিকুইজ অ্যাপ</span>
        <div class="stats">পয়েন্ট: <span id="score">0</span></div>
    </div>

    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('dict')">ডিকশনারি</button>
        <button class="tab-btn" onclick="switchTab('quiz')">ডেইলি কুইজ</button>
    </div>

    <div id="dictSection" class="section active">
        <div class="search-box">
            <input type="text" id="wordInput" placeholder="শব্দ বা বাক্য লিখুন...">
            <button id="micBtn" class="icon-btn" onclick="startVoiceSearch()" title="ভয়েস ইনপুট">🎙️</button>
            <button class="icon-btn" onclick="document.getElementById('imageInput').click()" title="ছবি থেকে সার্চ">📷</button>
            <input type="file" id="imageInput" accept="image/*" style="display: none;" onchange="processImageSearch(event)">
            <button class="action-btn" onclick="searchWord()">খুঁজুন</button>
        </div>
        <div id="resultContainer" class="result-card">
            <p style="color: #888; text-align: center; font-size: 14px;">অর্থ দেখতে সার্চ, ভয়েস বা ছবি ব্যবহার করুন</p>
        </div>
    </div>

    <div id="quizSection" class="section">
        <div class="quiz-card">
            <p id="quizQuestion" style="font-weight: bold; margin-bottom: 10px;">লোডিং...</p>
        </div>
        <div class="options-grid" id="optionsContainer"></div>
        <p id="quizFeedback" style="text-align: center; margin-top: 10px; font-weight: bold;"></p>
    </div>
</div>

<script>
    let userScore = 0;
    let currentQuizIndex = 0;
    let wordDatabase = [];
    let quizQuestions = [];

    // ১. উন্নত ভয়েস সার্চ ফিচারের ফাংশন
    function startVoiceSearch() {
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        const resultContainer = document.getElementById('resultContainer');
        const micBtn = document.getElementById('micBtn');
        const wordInput = document.getElementById('wordInput');
        
        if (!SpeechRecognition) {
            alert("আপনার ব্রাউজারে ভয়েস সাপোর্ট করে না। Google Chrome ব্রাউজার ব্যবহার করুন।");
            return;
        }

        const recognition = new SpeechRecognition();
        recognition.lang = 'en-US';
        recognition.interimResults = false;
        recognition.maxAlternatives = 1;

        micBtn.classList.add('listening');
        resultContainer.innerHTML = '<p style="text-align: center; color: #e74c3c; font-weight: bold;">🎙️ শুনছি... এখন কথা বলুন</p>';

        recognition.start();

        recognition.onresult = function(event) {
            micBtn.classList.remove('listening');
            const transcript = event.results[0][0].transcript;
            wordInput.value = transcript;
            searchWord();
        };

        recognition.onspeechend = function() {
            recognition.stop();
            micBtn.classList.remove('listening');
        };

        recognition.onerror = function(event) {
            micBtn.classList.remove('listening');
            if(event.error === 'not-allowed') {
                alert("মাইক্রোফোনের পারমিশন দেওয়া হয়নি। ব্রাউজার সেটিংস থেকে Microphone Allow করুন।");
            } else {
                resultContainer.innerHTML = '<p style="color: red; text-align: center;">কথা স্পষ্টভাবে বোঝা যায়নি। আবার চেষ্টা করুন!</p>';
            }
        };
    }

    // ২. দ্রুততম ইমেজ থেকে লেখা বের করার ফাংশন
    async function processImageSearch(event) {
        const file = event.target.files[0];
        const resultContainer = document.getElementById('resultContainer');
        const wordInput = document.getElementById('wordInput');
        
        if (!file) return;

        resultContainer.innerHTML = '<p style="text-align: center; color: #3498db; font-weight: bold;">🔍 ছবি বিশ্লেষণ করা হচ্ছে... একটু অপেক্ষা করুন</p>';

        if (typeof Tesseract === 'undefined') {
            resultContainer.innerHTML = '<p style="color: red; text-align: center;">ইমেজ ইঞ্জিন লোড হয়নি। ইন্টারনেট সংযোগ চেক করুন!</p>';
            return;
        }

        try {
            const { data: { text } } = await Tesseract.recognize(
                file,
                'eng',
                { logger: m => console.log(m) }
            );

            const cleanedText = text.replace(/[^a-zA-Z0-9\s]/g, '').trim();

            if (cleanedText) {
                wordInput.value = cleanedText;
                searchWord();
            } else {
                resultContainer.innerHTML = '<p style="color: red; text-align: center;">ছবিতে কোনো স্পষ্ট ইংরেজি লেখা পাওয়া যায়নি!</p>';
            }
        } catch (error) {
            console.error("OCR Error:", error);
            resultContainer.innerHTML = '<p style="color: red; text-align: center;">ছবি প্রসেস করা সম্ভব হয়নি। পরিষ্কার ছবি দিয়ে চেষ্টা করুন!</p>';
        }
    }

    function playSound(type) {
        try {
            const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            if (type === 'correct') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(587.33, audioCtx.currentTime);
                osc.frequency.setValueAtTime(880, audioCtx.currentTime + 0.1);
                gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.3);
            } else if (type === 'wrong') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(150, audioCtx.currentTime);
                osc.frequency.setValueAtTime(100, audioCtx.currentTime + 0.1);
                gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.3);
            }
        } catch (e) {
            console.log("Audio error:", e);
        }
    }

    async function loadWordsData() {
        try {
            const response = await fetch('./words.json');
            wordDatabase = await response.json();
            generateQuizFromDatabase();
        } catch (error) {
            console.error("Data loading error:", error);
        }
    }

    function generateQuizFromDatabase() {
        if (wordDatabase.length < 3) return;

        const shuffled = [...wordDatabase].sort(() => 0.5 - Math.random());
        quizQuestions = shuffled.map(item => {
            const otherMeanings = wordDatabase
                .filter(w => w.meaning !== item.meaning)
                .map(w => w.meaning)
                .sort(() => 0.5 - Math.random())
                .slice(0, 2);

            const options = [item.meaning, ...otherMeanings].sort(() => 0.5 - Math.random());

            return {
                question: `'${item.word.toUpperCase()}' এর সঠিক বাংলা অর্থ কোনটি?`,
                options: options,
                correct: item.meaning
            };
        });
    }

    function switchTab(tabName) {
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
        document.querySelectorAll('.section').forEach(sec => sec.classList.remove('active'));

        if (tabName === 'dict') {
            document.querySelectorAll('.tab-btn')[0].classList.add('active');
            document.getElementById('dictSection').classList.add('active');
        } else {
            document.querySelectorAll('.tab-btn')[1].classList.add('active');
            document.getElementById('quizSection').classList.add('active');
            loadQuiz();
        }
    }

    async function searchWord() {
        const textInput = document.getElementById('wordInput').value.trim();
        const resultContainer = document.getElementById('resultContainer');

        if (!textInput) {
            resultContainer.innerHTML = '<p style="color: red; text-align: center;">দয়া করে একটি শব্দ বা বাক্য লিখুন!</p>';
            return;
        }

        resultContainer.innerHTML = '<p style="text-align: center; color: #3498db;">অনুবাদ করা হচ্ছে...</p>';

        const cleanInput = textInput.toLowerCase();

        if (!textInput.includes(' ')) {
            const found = wordDatabase.find(item => item.word.toLowerCase() === cleanInput);
            if (found) {
                renderResult(found.word, found.meaning, found.category || "Local DB");
                return;
            }
        }

        try {
            const apiUrl = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=en&tl=bn&dt=t&dj=1&q=${encodeURIComponent(textInput)}`;
            const response = await fetch(apiUrl);
            const data = await response.json();

            if (data && data.sentences && data.sentences.length > 0) {
                let translatedText = data.sentences.map(s => s.trans).join('');
                const isSentence = textInput.includes(' ');
                renderResult(textInput, translatedText, isSentence ? "Sentence" : "Online API");
            } else {
                resultContainer.innerHTML = '<p style="color: red; text-align: center;">অনুবাদ পাওয়া যায়নি!</p>';
            }
        } catch (error) {
            resultContainer.innerHTML = '<p style="color: red; text-align: center;">অনুবাদ করতে সমস্যা হয়েছে। ইন্টারনেট কানেকশন চেক করুন!</p>';
        }
    }

    function renderResult(original, translation, tag) {
        const resultContainer = document.getElementById('resultContainer');
        resultContainer.innerHTML = `
            <div style="font-size: 16px; font-weight: bold; color: #2c3e50;">
                ${original} <span style="font-size: 11px; background: #2ecc71; color: white; padding: 2px 6px; border-radius: 4px; margin-left: 5px;">${tag}</span>
            </div>
            <div style="font-size: 16px; color: #27ae60; margin-top: 8px;"><b>বাংলা অনুবাদ:</b> ${translation}</div>
        `;
        userScore += 5;
        document.getElementById('score').innerText = userScore;
    }

    function loadQuiz() {
        if (quizQuestions.length === 0) generateQuizFromDatabase();
        if (quizQuestions.length === 0) return;

        const quiz = quizQuestions[currentQuizIndex];
        document.getElementById('quizQuestion').innerText = quiz.question;
        document.getElementById('quizFeedback').innerText = '';

        const optionsContainer = document.getElementById('optionsContainer');
        optionsContainer.innerHTML = '';

        quiz.options.forEach(opt => {
            const btn = document.createElement('button');
            btn.className = 'opt-btn';
            btn.innerText = opt;
            btn.onclick = () => checkAnswer(opt);
            optionsContainer.appendChild(btn);
        });
    }

    function checkAnswer(selectedOption) {
        const feedback = document.getElementById('quizFeedback');
        const currentCorrect = quizQuestions[currentQuizIndex].correct;

        if (selectedOption === currentCorrect) {
            playSound('correct');
            feedback.style.color = 'green';
            feedback.innerText = 'সঠিক উত্তর! 🎉 (+১০ পয়েন্ট)';
            userScore += 10;
            document.getElementById('score').innerText = userScore;

            setTimeout(() => {
                currentQuizIndex = (currentQuizIndex + 1) % quizQuestions.length;
                loadQuiz();
            }, 1000);
        } else {
            playSound('wrong');
            feedback.style.color = 'red';
            feedback.innerText = 'ভুল উত্তর! আবার চেষ্টা করুন।';
        }
    }

    window.addEventListener('DOMContentLoaded', loadWordsData);

    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('./pwabuilder-sw.js')
                .then((reg) => console.log('Service Worker Registered:', reg))
                .catch((err) => console.error('SW Registration Failed:', err));
        });
    }
</script>

</body>
</html>
