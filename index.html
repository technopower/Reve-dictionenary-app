<head>

    <!-- Fast OCR Engine for Image Text Reading -->

    <!-- Google AdSense / AdMob Web Script -->
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-3940256099942544" crossorigin="anonymous"></script>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #eef2f5; color: #333; padding: 15px; display: flex; justify-content: center; align-items: center; min-height: 100vh; flex-direction: column; }
        .app-container { background: #fff; padding: 20px; border-radius: 20px; box-shadow: 0 8px 25px rgba(0,0,0,0.12); width: 100%; max-width: 440px; overflow: hidden; }
        
        /* Banner Header */
        .hero-banner { text-align: center; background: linear-gradient(135deg, #0b874b, #16a085); color: white; padding: 18px 15px; border-radius: 16px; margin-bottom: 15px; }
        .hero-banner h1 { font-size: 26px; font-weight: 800; letter-spacing: 0.5px; margin-bottom: 4px; }
        .hero-banner h1 span { font-size: 18px; color: #f1c40f; font-style: italic; }
        .hero-banner p { font-size: 13px; opacity: 0.95; font-weight: 500; }

        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; background: #27ae60; color: white; padding: 10px 15px; border-radius: 10px; }
        .stats { font-size: 14px; font-weight: bold; }
        
        /* Centered Translation Direction Styling */
        .translation-direction { 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            background: #e8f8f5; 
            padding: 10px; 
            border-radius: 12px; 
            margin-bottom: 15px; 
            border: 1px solid #a3e4d7; 
            gap: 8px; 
            width: 100%;
        }

        .lang-select-box { 
            display: flex; 
            flex-direction: column; 
            align-items: center;
            justify-content: center;
            flex: 1; 
            min-width: 0;
        }

        .lang-select-box label { 
            font-size: 11px; 
            font-weight: bold; 
            color: #16a085; 
            margin-bottom: 4px; 
            text-align: center;
            white-space: nowrap;
        }

        .lang-select { 
            width: 100%;
            padding: 6px 4px; 
            border-radius: 6px; 
            border: 1px solid #16a085; 
            font-size: 12px; 
            font-weight: bold; 
            outline: none; 
            background: white; 
            cursor: pointer; 
            text-align: center;
            text-align-last: center;
        }

        .swap-btn { 
            background: #16a085; 
            color: white; 
            border: none; 
            border-radius: 50%; 
            width: 32px; 
            height: 32px; 
            font-size: 14px; 
            cursor: pointer; 
            display: flex;

            justify-content: center; 
            margin-top: 14px; 
            flex-shrink: 0; 
        }

        .swap-btn:hover { background: #117a65; }

        /* Feature Grid System */
        .features-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 15px; }
        .feature-item { background: #f8f9fa; border: 1px solid #e2e8f0; border-radius: 12px; padding: 10px 5px; text-align: center; cursor: pointer; transition: all 0.2s ease; }
        .feature-item:hover { transform: translateY(-2px); box-shadow: 0 4px 10px rgba(0,0,0,0.08); background: #f0fdf4; border-color: #27ae60; }
        .feature-icon { font-size: 22px; margin-bottom: 4px; display: block; }
        .feature-label { font-size: 11px; font-weight: bold; color: #2c3e50; line-height: 1.2; }

        .tabs { display: flex; gap: 10px; margin-bottom: 15px; }
        .tab-btn { flex: 1; padding: 10px; border: none; background: #e0e0e0; border-radius: 8px; cursor: pointer; font-weight: bold; transition: 0.3s; font-size: 12px; }
        .tab-btn.active { background: #27ae60; color: white; }
        .section { display: none; }
        .section.active { display: block; }
        
        .search-container { display: flex; flex-direction: column; gap: 8px; margin-bottom: 15px; }
        .search-input-group { display: flex; gap: 6px; align-items: center; }
        input { flex: 1; padding: 10px; font-size: 13px; border: 2px solid #ddd; border-radius: 8px; outline: none; }
        
        .icon-btn { background: #f0f0f0; border: 1px solid #ccc; padding: 8px 10px; border-radius: 8px; cursor: pointer; font-size: 14px; display: flex; align-items: center; justify-content: center; gap: 4px; font-weight: bold; }
        .icon-btn:hover { background: #e0e0e0; }
        .icon-btn.listening { background: #e74c3c; color: white; animation: pulse 1s infinite; }
        
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        button.action-btn { background: #27ae60; color: white; border: none; padding: 10px 12px; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 14px; }
        
        .speak-btn { background: #e74c3c; color: white; border: none; padding: 4px 8px; border-radius: 50%; cursor: pointer; font-size: 12px; margin-left: 6px; display: inline-flex; align-items: center; justify-content: center; }
        .speak-btn:hover { background: #c0392b; }

        .result-card { background: #f9f9f9; padding: 15px; border-radius: 10px; border-left: 4px solid #27ae60; min-height: 80px; margin-bottom: 15px; line-height: 1.6; }
        
        .quiz-card { background: #fff9c4; padding: 15px; border-radius: 10px; margin-bottom: 15px; text-align: center; border: 1px solid #fbc02d; }
        .quiz-title-eng { font-size: 12px; color: #795548; font-weight: bold; margin-bottom: 6px; display: block; }
        .options-grid { display: grid; gap: 10px; }
        
        .opt-wrapper { display: flex; align-items: center; gap: 6px; }
        .opt-btn { flex: 1; padding: 12px; background: white; border: 2px solid #fbc02d; border-radius: 8px; cursor: pointer; font-size: 15px; text-align: center; font-weight: bold; color: #333; }
        .opt-btn:hover { background: #fffde7; }

        /* Ad Placement Styles */
        .ad-container { width: 100%; text-align: center; margin: 10px 0; min-height: 50px; background: #f1f1f1; border: 1px dashed #ccc; border-radius: 8px; display: flex; align-items: center; justify-content: center; overflow: hidden; }

        /* Bottom Badge Strip */
        .footer-badge { display: flex; justify-content: space-around; align-items: center; background: #0b874b; color: white; padding: 8px; border-radius: 10px; font-size: 12px; font-weight: bold; margin-top: 10px; }
        .footer-badge span { display: flex; align-items: center; gap: 4px; }
    </style>
</head>
<body>

<div class="app-container">

    <!-- AdMob / AdSense Top Banner Ad Container -->

        <ins class="adsbygoogle"
             style="display:block; width:100%; height:50px;"
             data-ad-client="ca-pub-3940256099942544"

        <script>

        <div class="feature-item" onclick="startVoiceSearch()">

        </div>
        <div class="feature-item" onclick="document.getElementById('imageInput').click()">
            <span class="feature-icon">📷</span>
            <span class="feature-label">Image Translator</span>
        </div>
    </div>

    <div class="translation-direction">
        <div class="lang-select-box">
            <label for="sourceLang">থেকে (From):</label>
            <select id="sourceLang" class="lang-select" onchange="onLanguageChange()">
                <option value="en" selected>English</option>
                <option value="bn">Bangla (বাংলা)</option>
                <option value="auto">🌐 Auto Detect</option>
                <option value="ar">Arabic (العربية)</option>
                <option value="fr">French (Français)</option>
                <option value="de">German (Deutsch)</option>
                <option value="hi">Hindi (हिन्दी)</option>
                <option value="ja">Japanese (日本語)</option>
                <option value="ko">Korean (한국어)</option>
                <option value="pt">Portuguese (Português)</option>
                <option value="ru">Russian (Русский)</option>
                <option value="es">Spanish (Español)</option>
                <option value="ur">Urdu (উর্দু)</option>
            </select>
        </div>

        <button class="swap-btn" onclick="swapLanguages()" title="ভাষা অদলবদল করুন">⇄</button>

        <div class="lang-select-box">
            <label for="targetLang">অনুবাদ (To):</label>
            <select id="targetLang" class="lang-select" onchange="onLanguageChange()">
                <option value="en">English</option>
                <option value="bn" selected>Bangla (বাংলা)</option>
                <option value="ar">Arabic (العربية)</option>
                <option value="fr">French (Français)</option>
                <option value="de">German (Deutsch)</option>
                <option value="hi">Hindi (हिन्दी)</option>
                <option value="ja">Japanese (日本語)</option>
                <option value="ko">Korean (한국어)</option>
                <option value="pt">Portuguese (Português)</option>
                <option value="ru">Russian (Русский)</option>
                <option value="es">Spanish (Español)</option>
                <option value="ur">Urdu (উর্দু)</option>
            </select>
        </div>
    </div>

    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('dict')">DICTIONARY (ডিকশনারি)</button>
        <button class="tab-btn" onclick="switchTab('quiz')">DAILY QUIZ (ডেইলি কুইজ)</button>
    </div>

    <div id="dictSection" class="section active">
        <div class="search-container">
            <div class="search-input-group">
                <input type="text" id="wordInput" placeholder="বাংলা বা যেকোনো ভাষায় লিখুন...">
            </div>
            <div class="search-input-group">
                <button id="micBtn" class="icon-btn" onclick="startVoiceSearch()" title="ভয়েস ইনপুট">🎙️ কথা বলুন</button>
                <button class="icon-btn" onclick="document.getElementById('imageInput').click()" title="ছবি থেকে সার্চ">📷 স্ক্যান</button>
                <input type="file" id="imageInput" accept="image/*" style="display: none;" onchange="processImageSearch(event)">
                <button class="action-btn" style="flex:1;" onclick="searchWord()">খুঁজুন</button>
            </div>
        </div>
        <div id="resultContainer" class="result-card">
            <p style="color: #888; text-align: center; font-size: 13px;">শব্দ লিখুন, অনুবাদ এবং পাশাপাশি সঠিক বাংলা উচ্চারণ পেয়ে যাবেন</p>
        </div>

            <span id="quizQuestionEng" class="quiz-title-eng">What is the correct meaning?</span>

                <p id="quizQuestion" style="font-weight: bold; font-size: 17px; margin: 0; color: #2c3e50;">লোডিং...</p>
                <button class="speak-btn" onclick="speakCurrentQuestion()" title="উচ্চারণ শুনুন">🔊</button>
            </div>
        </div>

        <p id="quizFeedback" style="text-align: center; margin-top: 12px; font-weight: bold; font-size: 15px;"></p>

    <!-- AdMob / AdSense Bottom Banner Ad Container -->
    <div class="ad-container">
        <ins class="adsbygoogle"
             style="display:block; width:100%; height:50px;"
             data-ad-client="ca-pub-3940256099942544"
             data-ad-slot="6301802184"></ins>
        <script>
             (adsbygoogle = window.adsbygoogle || []).push({});
        </script>

    <!-- Bottom Feature Badges -->
    <div class="footer-badge">
        <span>✓ সহজ</span>
        <span>• দ্রুত</span>
        <span>• নির্ভরযোগ্য</span>

</div>

<script>
    let userScore = 0;
    let currentQuizIndex = 0;
    let wordDatabase = [];
    let quizQuestions = [];
    let searchCount = 0;

    // AdMob Helper for Mobile Apps (Cordova / Capacitor / WebView)
    function showAdMobInterstitial() {
        searchCount++;
        // Trigger Interstitial Ad every 3 searches
        if (searchCount % 3 === 0) {
            if (window.admob && window.admob.interstitial) {
                window.admob.interstitial.show();
            } else {
                console.log("AdMob Interstitial Triggered (Shows in compiled APK)");
            }
        }
    }

    function swapLanguages() {
        const sourceSelect = document.getElementById('sourceLang');
        const targetSelect = document.getElementById('targetLang');
        
        if (sourceSelect.value === 'auto') {
            sourceSelect.value = 'en';
        }

        const temp = sourceSelect.value;
        sourceSelect.value = targetSelect.value;
        targetSelect.value = temp;

        onLanguageChange();
    }

    function onLanguageChange() {
        const resultContainer = document.getElementById('resultContainer');
        resultContainer.innerHTML = '<p style="color: #888; text-align: center; font-size: 14px;">ভাষা পরিবর্তন করা হয়েছে। আবার খুঁজুন!</p>';
        generateQuizFromDatabase();
        if (document.getElementById('quizSection').classList.contains('active')) {
            loadQuiz();
        }
    }

    function speakText(text, langCode = 'en-US') {
        if ('speechSynthesis' in window) {
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = langCode;
            utterance.rate = 0.9;
            window.speechSynthesis.speak(utterance);
        } else {
            alert("আপনার ব্রাউজারে স্পিচ সাপোর্ট নেই!");
        }
    }

    function speakCurrentQuestion() {
        const quiz = quizQuestions[currentQuizIndex];
        if (quiz) {
            const sourceLang = document.getElementById('sourceLang').value;
            speakText(quiz.rawWord, sourceLang === 'auto' ? 'en' : sourceLang);
        }
    }

    function startVoiceSearch() {
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        const resultContainer = document.getElementById('resultContainer');
        const micBtn = document.getElementById('micBtn');
        const wordInput = document.getElementById('wordInput');
        const sourceLang = document.getElementById('sourceLang').value;
        
        if (!SpeechRecognition) {
            alert("আপনার ব্রাউজারে ভয়েস সাপোর্ট করে না। Google Chrome ব্যবহার করুন।");
            return;
        }

        const recognition = new SpeechRecognition();
        
        const langMap = {
            'bn': 'bn-BD', 'en': 'en-US', 'ar': 'ar-SA', 'fr': 'fr-FR',
            'de': 'de-DE', 'hi': 'hi-IN', 'ja': 'ja-JP', 'ko': 'ko-KR',
            'pt': 'pt-PT', 'ru': 'ru-RU', 'es': 'es-ES', 'ur': 'ur-PK'
        };

        recognition.lang = langMap[sourceLang] || 'en-US';
        recognition.interimResults = false;

        micBtn.classList.add('listening');
        resultContainer.innerHTML = '<p style="text-align: center; color: #e74c3c; font-weight: bold;">🎙️ শুনছি... মুখে বলুন</p>';

        recognition.start();

        recognition.onresult = function(event) {
            micBtn.classList.remove('listening');
            const transcript = event.results[0][0].transcript;
            wordInput.value = transcript;
            searchWord();
        };

        recognition.onspeechend = function() {
            recognition.stop();
            micBtn.classList.remove('listening');
        };

        recognition.onerror = function() {
            micBtn.classList.remove('listening');
            resultContainer.innerHTML = '<p style="color: red; text-align: center;">কথা বোঝা যায়নি। আবার চেষ্টা করুন!</p>';
        };
    }

    async function processImageSearch(event) {
        const file = event.target.files[0];
        const resultContainer = document.getElementById('resultContainer');
        const wordInput = document.getElementById('wordInput');
        
        if (!file) return;

        resultContainer.innerHTML = '<p style="text-align: center; color: #3498db; font-weight: bold;">🔍 ছবি বিশ্লেষণ করা হচ্ছে...</p>';

        try {
            const worker = await Tesseract.createWorker('ben+eng+ara');
            const ret = await worker.recognize(file);
            await worker.terminate();

            let cleanedText = ret.data.text.trim();

            if (cleanedText) {
                wordInput.value = cleanedText;
                searchWord();
            } else {
                resultContainer.innerHTML = '<p style="color: red; text-align: center;">ছবিতে কোনো স্পষ্ট লেখা পাওয়া যায়নি!</p>';
            }
        } catch (error) {
            console.error("OCR Error:", error);
            resultContainer.innerHTML = '<p style="color: red; text-align: center;">ছবি প্রসেস করতে সমস্যা হয়েছে!</p>';
        }
    }

    function playSound(type) {
        try {
            const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            if (type === 'correct') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(587.33, audioCtx.currentTime);
                osc.frequency.setValueAtTime(880, audioCtx.currentTime + 0.1);
                gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.3);
            } else if (type === 'wrong') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(150, audioCtx.currentTime);
                osc.frequency.setValueAtTime(100, audioCtx.currentTime + 0.1);
                gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.3);
            }
        } catch (e) {
            console.log("Audio error:", e);
        }
    }

    async function loadWordsData() {
        try {
            const response = await fetch('./words.json');
            wordDatabase = await response.json();
            generateQuizFromDatabase();
        } catch (error) {
            console.error("Data loading error:", error);
        }
    }

    async function fetchUniversalTranslation(text, sourceLang, targetLang) {
        try {
            const apiUrl = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=${sourceLang}&tl=${targetLang}&dt=t&dt=rm&dj=1&q=${encodeURIComponent(text)}`;
            const response = await fetch(apiUrl);
            const data = await response.json();

            if (data && data.sentences && data.sentences.length > 0) {
                const translatedText = data.sentences.map(s => s.trans || '').join('');
                const detectedLang = data.src || sourceLang;
                
                let transliteration = '';
                if (data.sentences[1] && data.sentences[1].src_translit) {
                    transliteration = data.sentences[1].src_translit;
                } else if (data.sentences[0] && data.sentences[0].translit) {
                    transliteration = data.sentences[0].translit;
                }

                return {
                    translatedText: translatedText,
                    srcLang: detectedLang,
                    transliteration: transliteration
                };
            }
        } catch (error) {
            console.error("Translation API error:", error);
        }
        return null;
    }

    function latinToBanglaPhonetic(text) {
        if (!text) return '';

        if (/[\u0980-\u09FF]/.test(text)) {
            return text;
        }

        const exactWordMap = {
            'I': 'আই', 'WILL': 'উইল', 'GO': 'গো', 'TO': 'টু', 'DHAKA': 'ঢাকা',
            'YOU': 'ইউ', 'HE': 'হি', 'SHE': 'শি', 'THEY': 'দে', 'WE': 'উই',
            'AM': 'এম', 'IS': 'ইজ', 'ARE': 'আর', 'WAS': 'ওয়াজ', 'WERE': 'ওয়ার',
            'SA-AZHABU': 'সা-আজহাবূ', 'ILA': 'ইলা', 'MARHABAN': 'মারহাবান', 'SHUKRAN': 'শুকরান'
        };

        const words = text.trim().split(/\s+/);
        const banglaWords = words.map(w => {
            const upperW = w.toUpperCase();
            if (exactWordMap[upperW]) return exactWordMap[upperW];

            return w.toLowerCase()
                .replace(/sh/g, 'শ').replace(/ch/g, 'চ').replace(/kh/g, 'খ')
                .replace(/gh/g, 'ঘ').replace(/th/g, 'থ').replace(/ph/g, 'ফ')
                .replace(/bh/g, 'ভ').replace(/aa/g, 'আ').replace(/ee/g, 'ঈ')
                .replace(/oo/g, 'ঊ').replace(/a/g, 'আ').replace(/e/g, 'এ')
                .replace(/i/g, 'ই').replace(/o/g, 'ও').replace(/u/g, 'উ')
                .replace(/b/g, 'ব').replace(/c/g, 'ক').replace(/d/g, 'ড')
                .replace(/f/g, 'ফ').replace(/g/g, 'গ').replace(/h/g, 'হ')
                .replace(/j/g, 'জ').replace(/k/g, 'ক').replace(/l/g, 'ল')
                .replace(/m/g, 'ম').replace(/n/g, 'ন').replace(/p/g, 'প')
                .replace(/r/g, 'র').replace(/s/g, 'স').replace(/t/g, 'ট')
                .replace(/v/g, 'ভ').replace(/w/g, 'ওয়া').replace(/y/g, 'ইয়')
                .replace(/z/g, 'জ');
        });

        return banglaWords.join(' ');
    }

    async function searchWord() {
        const textInput = document.getElementById('wordInput').value.trim();
        const resultContainer = document.getElementById('resultContainer');
        const sourceLang = document.getElementById('sourceLang').value;
        const targetLang = document.getElementById('targetLang').value;

        if (!textInput) {
            resultContainer.innerHTML = '<p style="color: red; text-align: center;">দয়া করে কোনো শব্দ বা বাক্য লিখুন!</p>';
            return;
        }

        showAdMobInterstitial();

        resultContainer.innerHTML = '<p style="text-align: center; color: #3498db;">🔍 অনুবাদ ও উচ্চারণ তৈরি হচ্ছে...</p>';

        const translationRes = await fetchUniversalTranslation(textInput, sourceLang, targetLang);

        if (!translationRes) {
            resultContainer.innerHTML = '<p style="color: red; text-align: center;">অনুবাদ পাওয়া যায়নি!</p>';
            return;
        }

        let sourceBanglaPhonetic = '';
        let targetBanglaPhonetic = '';
        let banglaMeaning = '';

        if (!/[\u0980-\u09FF]/.test(textInput)) {
            if (translationRes.transliteration) {
                sourceBanglaPhonetic = latinToBanglaPhonetic(translationRes.transliteration);
            } else if (sourceLang === 'en' || translationRes.srcLang === 'en') {
                sourceBanglaPhonetic = latinToBanglaPhonetic(textInput);
            }
        }

        if (targetLang !== 'bn' && !/[\u0980-\u09FF]/.test(translationRes.translatedText)) {
            const targetTransRes = await fetchUniversalTranslation(translationRes.translatedText, targetLang, 'en');
            if (targetTransRes && targetTransRes.transliteration) {
                targetBanglaPhonetic = latinToBanglaPhonetic(targetTransRes.transliteration);
            } else if (targetLang === 'en') {
                targetBanglaPhonetic = latinToBanglaPhonetic(translationRes.translatedText);
            }
        }

        if (targetLang === 'bn') {
            banglaMeaning = translationRes.translatedText;
        } else {
            const bnMeaningRes = await fetchUniversalTranslation(textInput, sourceLang, 'bn');
            if (bnMeaningRes) {
                banglaMeaning = bnMeaningRes.translatedText;
            }
        }

        renderResult(textInput, translationRes.translatedText, translationRes.srcLang, targetLang, sourceBanglaPhonetic, targetBanglaPhonetic, banglaMeaning);
    }

    function renderResult(original, translation, srcLang, targetLang, sourcePhonetic = '', targetPhonetic = '', banglaMeaning = '') {
        const resultContainer = document.getElementById('resultContainer');
        
        const safeOriginal = original.replace(/'/g, "\\'");
        const safeTranslation = translation.replace(/'/g, "\\'");

        resultContainer.innerHTML = `
            <div style="font-size: 16px; font-weight: bold; color: #2c3e50; margin-bottom: 8px;">
                <span><b>মূল শব্দ:</b> ${original}</span> 
                ${sourcePhonetic ? `<span style="color: #27ae60; margin-left: 6px;">👉 ${sourcePhonetic}</span>` : ''}
                <button class="speak-btn" onclick="speakText('${safeOriginal}', '${srcLang}')" title="উচ্চারণ শুনুন">🔊</button>
            </div>
            
            <div style="font-size: 17px; color: #27ae60; margin-bottom: 8px; display: flex; align-items: center; flex-wrap: wrap;">
                <b>অনুবাদ:</b> <span style="margin-left: 5px; font-weight: bold;">${translation}</span>
                ${targetPhonetic ? `<span style="color: #8e44ad; margin-left: 6px; font-size: 15px;">👉 (${targetPhonetic})</span>` : ''}
                <button class="speak-btn" onclick="speakText('${safeTranslation}', '${targetLang}')" title="উচ্চারণ শুনুন">🔊</button>
            </div>

            ${banglaMeaning && targetLang !== 'bn' ? `
            <div style="font-size: 15px; color: #d35400;">
                <b>👉 অর্থ:</b> <span style="font-weight: bold;">${banglaMeaning}</span>
            </div>` : ''}
        `;
        userScore += 5;
        document.getElementById('score').innerText = userScore;
    }

    async function generateQuizFromDatabase() {
        if (!wordDatabase || wordDatabase.length < 3) return;

        const targetLang = document.getElementById('targetLang').value;
        const sourceLang = document.getElementById('sourceLang').value;
        const shuffled = [...wordDatabase].sort(() => 0.5 - Math.random()).slice(0, 5);
        
        quizQuestions = [];
        for (let item of shuffled) {
            let questionWord = item.word;
            let correctMeaning = item.meaning;

            if (sourceLang !== 'en' && sourceLang !== 'auto') {
                const srcTrans = await fetchUniversalTranslation(item.word, 'en', sourceLang);
                if (srcTrans) questionWord = srcTrans.translatedText;
            }

            const transRes = await fetchUniversalTranslation(item.word, 'en', targetLang);
            if (transRes) correctMeaning = transRes.translatedText;

            const otherWords = wordDatabase.filter(w => w.word !== item.word).sort(() => 0.5 - Math.random()).slice(0, 2);
            let wrongOption1 = otherWords[0].meaning;
            let wrongOption2 = otherWords[1].meaning;

            const trans1 = await fetchUniversalTranslation(otherWords[0].word, 'en', targetLang);
            const trans2 = await fetchUniversalTranslation(otherWords[1].word, 'en', targetLang);
            if (trans1) wrongOption1 = trans1.translatedText;
            if (trans2) wrongOption2 = trans2.translatedText;

            const options = [correctMeaning, wrongOption1, wrongOption2].sort(() => 0.5 - Math.random());

            quizQuestions.push({
                rawWord: questionWord,
                questionEng: `What is the correct meaning of '${questionWord.toUpperCase()}'?`,
                questionBn: `'${questionWord}' - এর সঠিক অর্থ কোনটি?`,
                options: options,
                correct: correctMeaning
            });
        }
    }

    function switchTab(tabName) {
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
        document.querySelectorAll('.section').forEach(sec => sec.classList.remove('active'));

        if (tabName === 'dict') {
            document.querySelectorAll('.tab-btn')[0].classList.add('active');
            document.getElementById('dictSection').classList.add('active');
        } else {
            document.querySelectorAll('.tab-btn')[1].classList.add('active');
            document.getElementById('quizSection').classList.add('active');
            loadQuiz();
        }
    }

    function loadQuiz() {
        if (quizQuestions.length === 0) {
            document.getElementById('quizQuestion').innerText = "কুইজ প্রস্তুত হচ্ছে...";
            generateQuizFromDatabase().then(() => loadQuiz());
            return;
        }

        const quiz = quizQuestions[currentQuizIndex];
        document.getElementById('quizQuestionEng').innerText = quiz.questionEng;
        document.getElementById('quizQuestion').innerText = quiz.questionBn;
        document.getElementById('quizFeedback').innerText = '';

        const optionsContainer = document.getElementById('optionsContainer');
        optionsContainer.innerHTML = '';

        const targetLang = document.getElementById('targetLang').value;

        quiz.options.forEach(opt => {
            const wrapper = document.createElement('div');
            wrapper.className = 'opt-wrapper';

            const btn = document.createElement('button');
            btn.className = 'opt-btn';
            btn.innerText = opt;
            btn.onclick = () => checkAnswer(opt);

            const audioBtn = document.createElement('button');
            audioBtn.className = 'speak-btn';
            audioBtn.innerHTML = '🔊';
            audioBtn.title = 'উচ্চারণ শুনুন';
            audioBtn.onclick = (e) => {
                e.stopPropagation();
                speakText(opt, targetLang);
            };

            wrapper.appendChild(btn);
            wrapper.appendChild(audioBtn);
            optionsContainer.appendChild(wrapper);
        });
    }

    function checkAnswer(selectedOption) {
        const feedback = document.getElementById('quizFeedback');
        const currentCorrect = quizQuestions[currentQuizIndex].correct;

        if (selectedOption === currentCorrect) {
            playSound('correct');
            feedback.style.color = 'green';
            feedback.innerText = 'Correct! / সঠিক উত্তর! 🎉 (+১০ পয়েন্ট)';
            userScore += 10;
            document.getElementById('score').innerText = userScore;

            setTimeout(() => {
                currentQuizIndex = (currentQuizIndex + 1) % quizQuestions.length;
                loadQuiz();
            }, 1000);
        } else {
            playSound('wrong');
            feedback.style.color = 'red';
            feedback.innerText = 'Wrong Answer! / ভুল উত্তর! আবার চেষ্টা করুন।';
        }
    }

    window.addEventListener('DOMContentLoaded', loadWordsData);

    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('./pwabuilder-sw.js')
                .then((reg) => console.log('Service Worker Registered:', reg))
                .catch((err) => console.error('SW Registration Failed:', err));
        });
    }
</script>
