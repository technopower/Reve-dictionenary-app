<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Translator & Dictionary</title>
    <style>
        :root {
            --bg-color: #f4f7f6;
            --card-bg: #ffffff;
            --text-color: #2c3e50;
            --border-color: #e2e8f0;
            --primary-color: #16a085;
            --primary-hover: #12876f;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 500px;
            background: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
        }

        .lang-select-group {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            margin-bottom: 12px;
        }

        select {
            flex: 1;
            padding: 8px 10px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            outline: none;
            background: #fff;
            color: var(--text-color);
            font-size: 14px;
        }

        .swap-btn {
            background: #eef2f5;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 8px 12px;
            cursor: pointer;
            font-size: 16px;
            transition: 0.2s;
        }

        .swap-btn:hover {
            background: #e2e8f0;
        }

        .input-group {
            margin-bottom: 12px;
        }

        input[type="text"] {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 15px;
            outline: none;
        }

        input[type="text"]:focus {
            border-color: var(--primary-color);
        }

        .btn-group {
            display: flex;
            gap: 8px;
            margin-bottom: 15px;
        }

        .action-btn {
            flex: 1;
            padding: 10px;
            background: #eef2f5;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            color: var(--text-color);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
        }

        .search-btn {
            background: var(--primary-color);
            color: white;
            border: none;
            font-weight: bold;
        }

        .search-btn:hover {
            background: var(--primary-hover);
        }

        .result-card {
            background: #f8fafc;
            border-left: 4px solid var(--primary-color);
            border-radius: 8px;
            padding: 15px;
            margin-top: 15px;
        }

        .icon-btn, .speak-btn {
            background: none;
            border: 1px solid var(--border-color);
            border-radius: 5px;
            padding: 4px 8px;
            cursor: pointer;
            font-size: 12px;
            margin-right: 5px;
        }

        .speak-btn-speaker {
            background: #e74c3c;
            color: white;
            border: none;
            border-radius: 50%;
            width: 32px;
            height: 32px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }
    </style>
</head>
<body>

<div class="container">
    <!-- Language Selection -->
    <div class="lang-select-group">
        <select id="sourceLang">
            <option value="auto">Auto Detect</option>
            <option value="en">English</option>
            <option value="bn">Bangla</option>
        </select>

        <button class="swap-btn" onclick="swapLanguages()">⇄</button>

        <select id="targetLang">
            <option value="bn" selected>Bangla</option>
            <option value="en">English</option>
        </select>
    </div>

    <!-- Input Box -->
    <div class="input-group">
        <input type="text" id="wordInput" placeholder="শব্দ বা বাক্য লিখুন..." onkeypress="handleKeyPress(event)">
    </div>

    <!-- Action Buttons -->
    <div class="btn-group">
        <button class="action-btn" onclick="startVoiceInput()">🎙️ কথা বলুন</button>
        <button class="action-btn" onclick="alert('Scan Feature Placeholder')">📷 স্ক্যান</button>
        <button class="action-btn search-btn" onclick="searchWord()">খুঁজুন</button>
    </div>

    <!-- Result Display -->
    <div id="resultContainer" class="result-card">
        <p style="text-align: center; color: #7f8c8d; font-size: 14px;">কোন শব্দ খুঁজুন বা অনুবাদ করুন</p>
    </div>
</div>

<script>
    // IELTS Vocab Sample List
    const ieltsVocabList = [
        { word: "ami feni jabo", usage: "Writing Task 1/2 and Speaking Topic Context", syn: "I will go to Feni" },
        { word: "abandon", usage: "Writing Task 2 / Speaking", syn: "forsake, leave, desert" }
    ];

    // Language Swap Function
    function swapLanguages() {
        const sourceSelect = document.getElementById('sourceLang');
        const targetSelect = document.getElementById('targetLang');
        
        if (sourceSelect.value === 'auto') {
            sourceSelect.value = targetSelect.value === 'bn' ? 'en' : 'bn';
        }
        
        const temp = sourceSelect.value;
        sourceSelect.value = targetSelect.value;
        targetSelect.value = temp;
    }

    // Enter Key Handler
    function handleKeyPress(e) {
        if (e.key === 'Enter') {
            searchWord();
        }
    }

    // Speech synthesis helper
    function speakText(text, lang) {
        if ('speechSynthesis' in window) {
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = lang;
            window.speechSynthesis.speak(utterance);
        } else {
            alert('আপনার ব্রাউজার Text-to-Speech সমর্থন করে না।');
        }
    }

    // Speech Recognition Handler
    function startVoiceInput() {
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SpeechRecognition) {
            alert('আপনার ব্রাউজার Voice Input সমর্থন করে না।');
            return;
        }

        const recognition = new SpeechRecognition();
        const sourceLang = document.getElementById('sourceLang').value;
        recognition.lang = sourceLang === 'bn' ? 'bn-BD' : 'en-US';

        recognition.onstart = function() {
            document.getElementById('wordInput').placeholder = "শুনছি, বলুন...";
        };

        recognition.onresult = function(event) {
            const transcript = event.results[0][0].transcript;
            document.getElementById('wordInput').value = transcript;
            searchWord();
        };

        recognition.onerror = function() {
            alert('ভয়েস ইনপুট নেওয়া সম্ভব হয়নি। আবার চেষ্টা করুন।');
        };

        recognition.onend = function() {
            document.getElementById('wordInput').placeholder = "শব্দ বা বাক্য লিখুন...";
        };

        recognition.start();
    }

    // Copy to Clipboard
    function copyToClipboard(text) {
        navigator.clipboard.writeText(text).then(() => {
            alert('অনুলিপি করা হয়েছে!');
        });
    }

    // Main Search Function
    async function searchWord() {
        const inputField = document.getElementById('wordInput');
        const word = inputField.value.trim();
        const sourceLang = document.getElementById('sourceLang').value;
        const targetLang = document.getElementById('targetLang').value;
        const resCard = document.getElementById('resultContainer');

        if (!word) {
            alert('একটি শব্দ বা বাক্য লিখুন!');
            return;
        }

        resCard.innerHTML = '<p style="text-align: center; color: #16a085;">🔍 অনুবাদ ও অর্থ অনুসন্ধান করা হচ্ছে...</p>';

        try {
            // Google Translation API call
            const res = await fetch(`https://translate.googleapis.com/translate_a/single?client=gtx&sl=${sourceLang}&tl=${targetLang}&dt=t&q=${encodeURIComponent(word)}`);
            const data = await res.json();
            
            let translatedText = '';
            if (data && data[0]) {
                data[0].forEach(item => {
                    if (item[0]) translatedText += item[0];
                });
            }

            // Check dictionary list or default usage
            let ieltsInfo = ieltsVocabList.find(v => v.word.toLowerCase() === word.toLowerCase());
            let usageHtml = ieltsInfo 
                ? `<p style="font-size: 13px; color: #34495e;">🎯 <b>IELTS Usage:</b> ${ieltsInfo.usage}</p>` 
                : `<p style="font-size: 13px; color: #34495e;">🎯 <b>IELTS Usage:</b> Writing Task 1/2 and Speaking Topic Context</p>`;

            const detectedLang = (data && data[2]) ? data[2] : sourceLang;
            const sourceSpeakLang = (detectedLang === 'bn' || sourceLang === 'bn') ? 'bn-BD' : 'en-US';
            const targetSpeakLang = targetLang === 'bn' ? 'bn-BD' : 'en-US';

            resCard.innerHTML = `
                <div style="display:flex; justify-content:space-between; align-items:center;">
                    <h3 style="color:#16a085; font-size:16px; margin: 0;">${word}</h3>
                    <button class="speak-btn-speaker" onclick="speakText('${word.replace(/'/g, "\\'")}', '${sourceSpeakLang}')">🔊</button>
                </div>
                <p style="font-size: 14px; font-weight: bold; margin: 10px 0 5px 0; color: var(--text-color);">
                    অর্থ: ${translatedText}
                </p>
                <div style="margin-bottom: 10px;">
                    <button class="speak-btn" onclick="speakText('${translatedText.replace(/'/g, "\\'")}', '${targetSpeakLang}')">🔊 অনুবাদ শুনুন</button>
                </div>
                <hr style="margin: 10px 0; border: 0; border-top: 1px solid var(--border-color);">
                ${usageHtml}
                <button class="action-btn" style="margin-top:10px; width: fit-content; padding: 5px 10px;" onclick="copyToClipboard('${word} : ${translatedText}')">📋 Copy Word & Meaning</button>
            `;
        } catch(e) {
            resCard.innerHTML = '<p style="color:red; text-align:center;">অনুবাদ ব্যর্থ হয়েছে। ইন্টারনেট সংযোগ পরীক্ষা করুন।</p>';
        }
    }
</script>

</body>
</html>
