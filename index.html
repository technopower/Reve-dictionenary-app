<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>শব্দকোষ ও কুইজ একাডেমি</title>

    <!-- PWA Manifest Link -->
    <link rel="manifest" href="manifest.json">

    <!-- PWA Meta Tags -->
    <meta name="theme-color" content="#2ecc71">
    <link rel="apple-touch-icon" href="assets/logos/index_logo.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="ডিকুইজ অ্যাপ">

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="assets/logos/index_logo.png">

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #f0f4f8; color: #333; padding: 15px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .app-container { background: #fff; padding: 20px; border-radius: 20px; box-shadow: 0 6px 20px rgba(0,0,0,0.1); width: 100%; max-width: 400px; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; background: #2ecc71; color: white; padding: 12px 15px; border-radius: 12px; }
        .stats { font-size: 14px; font-weight: bold; }
        .tabs { display: flex; gap: 10px; margin-bottom: 20px; }
        .tab-btn { flex: 1; padding: 10px; border: none; background: #e0e0e0; border-radius: 8px; cursor: pointer; font-weight: bold; transition: 0.3s; }
        .tab-btn.active { background: #3498db; color: white; }
        .section { display: none; }
        .section.active { display: block; }
        .search-box { display: flex; gap: 8px; margin-bottom: 15px; }
        input { flex: 1; padding: 10px; font-size: 15px; border: 2px solid #ddd; border-radius: 8px; outline: none; }
        button.action-btn { background: #3498db; color: white; border: none; padding: 0 15px; border-radius: 8px; cursor: pointer; font-weight: bold; }
        .result-card { background: #f9f9f9; padding: 12px; border-radius: 8px; border-left: 4px solid #3498db; min-height: 90px; margin-bottom: 15px; }
        .quiz-card { background: #fff9c4; padding: 15px; border-radius: 10px; margin-bottom: 15px; text-align: center; }
        .options-grid { display: grid; gap: 8px; }
        .opt-btn { padding: 10px; background: white; border: 2px solid #fbc02d; border-radius: 8px; cursor: pointer; font-size: 15px; text-align: center; font-weight: bold; }
        .opt-btn:hover { background: #fffde7; }
    </style>
</head>
<body>

<div class="app-container">
    <div class="header">
        <span>🔥 ডিকুইজ অ্যাপ</span>
        <div class="stats">পয়েন্ট: <span id="score">0</span> | স্ট্রিক: <span id="streak">1</span> দিন</div>
    </div>

    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('dict')">ডিকশনারি</button>
        <button class="tab-btn" onclick="switchTab('quiz')">ডেইলি কুইজ</button>
    </div>

    <div id="dictSection" class="section active">
        <div class="search-box">
            <input type="text" id="wordInput" placeholder="ইংরেজি শব্দ লিখুন...">
            <button class="action-btn" onclick="searchWord()">খুঁজুন</button>
        </div>
        <div id="resultContainer" class="result-card">
            <p style="color: #888; text-align: center; font-size: 14px;">শব্দের অর্থ দেখতে সার্চ করুন</p>
        </div>
    </div>

    <div id="quizSection" class="section">
        <div class="quiz-card">
            <p id="quizQuestion" style="font-weight: bold; margin-bottom: 10px;">'Apple' এর সঠিক অর্থ কোনটি?</p>
        </div>
        <div class="options-grid" id="optionsContainer">
            <button class="opt-btn" onclick="checkAnswer('আপেল')">আপেল</button>
            <button class="opt-btn" onclick="checkAnswer('কলা')">কলা</button>
            <button class="opt-btn" onclick="checkAnswer('আম')">আম</button>
        </div>
        <p id="quizFeedback" style="text-align: center; margin-top: 10px; font-weight: bold;"></p>
    </div>
</div>

<script>
    let userScore = 0;
    let userStreak = 1;
    let currentQuizIndex = 0;

    // অফলাইন ব্যাকআপ ডিকশনারি ডাটাবেজ
    const localDictionary = {
        "apple": "আপেল", "book": "বই", "water": "পানি", "school": "বিদ্যালয়", "cat": "বিড়াল",
        "dog": "কুকুর", "pen": "কলম", "sun": "সূর্য", "moon": "চাঁদ", "tree": "গাছ",
        "flower": "ফুল", "mother": "মা", "father": "বাবা", "brother": "ভাই", "sister": "বোন",
        "friend": "বন্ধু", "love": "ভালোবাসা", "home": "বাড়ি", "food": "খাবার", "milk": "দুধ",
        "time": "সময়", "day": "দিন", "night": "রাত", "boy": "ছেলে", "girl": "মেয়ে",
        "teacher": "শিক্ষক", "student": "ছাত্র/ছাত্রী", "bird": "পাখি", "fish": "মাছ", "sky": "আকাশ",
        "river": "নদী", "city": "শহর", "village": "গ্রাম", "car": "গাড়ি", "road": "রাস্তা",
        "computer": "কম্পিউটার", "phone": "ফোন", "money": "টাকা", "work": "কাজ", "life": "জীবন"
    };

    // কুইজের বড় তালিকা (২০টি প্রশ্ন)
    const quizData = [
        { question: "'Apple' এর সঠিক বাংলা অর্থ কোনটি?", options: ["আপেল", "কলা", "আম"], correct: "আপেল" },
        { question: "'Book' এর সঠিক বাংলা অর্থ কোনটি?", options: ["কলম", "বই", "খাতা"], correct: "বই" },
        { question: "'Water' এর সঠিক বাংলা অর্থ কোনটি?", options: ["পানি", "আগুন", "বাতাস"], correct: "পানি" },
        { question: "'School' এর সঠিক বাংলা অর্থ কোনটি?", options: ["হাসপাতাল", "বিদ্যালয়", "দোকান"], correct: "বিদ্যালয়" },
        { question: "'Sun' এর সঠিক বাংলা অর্থ কোনটি?", options: ["চাঁদ", "সূর্য", "তারা"], correct: "সূর্য" },
        { question: "'Mother' এর সঠিক বাংলা অর্থ কোনটি?", options: ["বোন", "মা", "খালা"], correct: "মা" },
        { question: "'Tree' এর সঠিক বাংলা অর্থ কোনটি?", options: ["গাছ", "ফুল", "পাতা"], correct: "গাছ" },
        { question: "'Cat' এর সঠিক বাংলা অর্থ কোনটি?", options: ["কুকুর", "বিড়াল", "ইঁদুর"], correct: "বিড়াল" },
        { question: "'Home' এর সঠিক বাংলা অর্থ কোনটি?", options: ["বাড়ি", "দোকান", "অফিস"], correct: "বাড়ি" },
        { question: "'Friend' এর সঠিক বাংলা অর্থ কোনটি?", options: ["শত্রু", "বন্ধু", "ভাই"], correct: "বন্ধু" },
        { question: "'Teacher' এর সঠিক বাংলা অর্থ কোনটি?", options: ["ছাত্র", "শিক্ষক", "ডাক্তার"], correct: "শিক্ষক" },
        { question: "'Money' এর সঠিক বাংলা অর্থ কোনটি?", options: ["টাকা", "খাবার", "কাপড়"], correct: "টাকা" },
        { question: "'Fish' এর সঠিক বাংলা অর্থ কোনটি?", options: ["পাখি", "মাছ", "হরিণ"], correct: "মাছ" },
        { question: "'Sky' এর সঠিক বাংলা অর্থ কোনটি?", options: ["মাটি", "আকাশ", "পাহাড়"], correct: "আকাশ" },
        { question: "'Road' এর সঠিক বাংলা অর্থ কোনটি?", options: ["রাস্তা", "নদী", "মাঠ"], correct: "রাস্তা" },
        { question: "'Food' এর সঠিক বাংলা অর্থ কোনটি?", options: ["পানি", "খাবার", "ফল"], correct: "খাবার" },
        { question: "'Time' এর সঠিক বাংলা অর্থ কোনটি?", options: ["সময়", "তারিখ", "ঘড়ি"], correct: "সময়" },
        { question: "'Brother' এর সঠিক বাংলা অর্থ কোনটি?", options: ["ভাই", "বোন", "বাবা"], correct: "ভাই" },
        { question: "'Love' এর সঠিক বাংলা অর্থ কোনটি?", options: ["ঘৃণা", "ভালোবাসা", "রাগ"], correct: "ভালোবাসা" },
        { question: "'Bird' এর সঠিক বাংলা অর্থ কোনটি?", options: ["মাছ", "পাখি", "পশু"], correct: "পাখি" }
    ];

    function switchTab(tabName) {
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
        document.querySelectorAll('.section').forEach(sec => sec.classList.remove('active'));

        if (tabName === 'dict') {
            document.querySelectorAll('.tab-btn')[0].classList.add('active');
            document.getElementById('dictSection').classList.add('active');
        } else {
            document.querySelectorAll('.tab-btn')[1].classList.add('active');
            document.getElementById('quizSection').classList.add('active');
            loadQuiz();
        }
    }

    // ডিকশনারি সার্চ (হাইব্রিড: অফলাইন ডিকশনারি + অনলাইন এপিআই)
    async function searchWord() {
        const wordInput = document.getElementById('wordInput').value.trim().toLowerCase();
        const resultContainer = document.getElementById('resultContainer');

        if (!wordInput) {
            resultContainer.innerHTML = '<p style="color: red; text-align: center;">দয়া করে একটি শব্দ লিখুন!</p>';
            return;
        }

        resultContainer.innerHTML = '<p style="text-align: center; color: #3498db;">খোঁজা হচ্ছে...</p>';

        // প্রথমে অফলাইন ডাটাবেজে দেখা হবে
        if (localDictionary[wordInput]) {
            renderResult(wordInput, localDictionary[wordInput]);
            return;
        }

        // অফলাইনে না পেলে অনলাইন থেকে ট্রাই করবে
        try {
            const response = await fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(wordInput)}&langpair=en|bn`);
            const data = await response.json();

            if (data.responseData && data.responseData.translatedText) {
                renderResult(wordInput, data.responseData.translatedText);
            } else {
                resultContainer.innerHTML = '<p style="color: red; text-align: center;">শব্দটি পাওয়া যায়নি!</p>';
            }
        } catch (error) {
            resultContainer.innerHTML = '<p style="color: red; text-align: center;">শব্দটি পাওয়া যায়নি। অন্য শব্দ চেষ্টা করুন!</p>';
        }
    }

    function renderResult(word, meaning) {
        const resultContainer = document.getElementById('resultContainer');
        resultContainer.innerHTML = `
            <div style="font-size: 18px; font-weight: bold; color: #2c3e50; text-transform: capitalize;">${word}</div>
            <div style="font-size: 16px; color: #27ae60; margin-top: 6px;"><b>বাংলা অর্থ:</b> ${meaning}</div>
        `;
        userScore += 5;
        document.getElementById('score').innerText = userScore;
    }

    // কুইজ লোড করার ফাংশন
    function loadQuiz() {
        const quiz = quizData[currentQuizIndex];
        document.getElementById('quizQuestion').innerText = quiz.question;
        document.getElementById('quizFeedback').innerText = '';

        const optionsContainer = document.getElementById('optionsContainer');
        optionsContainer.innerHTML = '';

        quiz.options.forEach(opt => {
            const btn = document.createElement('button');
            btn.className = 'opt-btn';
            btn.innerText = opt;
            btn.onclick = () => checkAnswer(opt);
            optionsContainer.appendChild(btn);
        });
    }

    // কুইজের উত্তর চেক
    function checkAnswer(selectedOption) {
        const feedback = document.getElementById('quizFeedback');
        const currentCorrect = quizData[currentQuizIndex].correct;

        if (selectedOption === currentCorrect) {
            feedback.style.color = 'green';
            feedback.innerText = 'সঠিক উত্তর! 🎉 (+১০ পয়েন্ট)';
            userScore += 10;
            document.getElementById('score').innerText = userScore;

            setTimeout(() => {
                currentQuizIndex = (currentQuizIndex + 1) % quizData.length;
                loadQuiz();
            }, 1000);
        } else {
            feedback.style.color = 'red';
            feedback.innerText = 'ভুল উত্তর! আবার চেষ্টা করুন।';
        }
    }

    // Service Worker Registration
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('./pwabuilder-sw.js')
                .then((reg) => console.log('Service Worker Registered:', reg))
                .catch((err) => console.error('SW Registration Failed:', err));
        });
    }
</script>
