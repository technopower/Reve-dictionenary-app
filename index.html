<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>শব্দকোষ ও কুইজ একাডেমি</title>

    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#2ecc71">
    <link rel="apple-touch-icon" href="assets/logos/index_logo.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="ডিকুইজ অ্যাপ">
    <link rel="icon" type="image/png" href="assets/logos/index_logo.png">

    <!-- Fast OCR Engine for Image Text Reading -->
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #f0f4f8; color: #333; padding: 15px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .app-container { background: #fff; padding: 20px; border-radius: 20px; box-shadow: 0 6px 20px rgba(0,0,0,0.1); width: 100%; max-width: 420px; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; background: #2ecc71; color: white; padding: 12px 15px; border-radius: 12px; }
        .stats { font-size: 14px; font-weight: bold; }
        
        .lang-bar { display: flex; align-items: center; justify-content: space-between; background: #e8f8f5; padding: 8px 12px; border-radius: 10px; margin-bottom: 15px; border: 1px solid #a3e4d7; }
        .lang-bar label { font-size: 13px; font-weight: bold; color: #16a085; }
        .lang-select { padding: 6px 10px; border-radius: 6px; border: 1px solid #16a085; font-size: 13px; font-weight: bold; outline: none; background: white; cursor: pointer; }

        .tabs { display: flex; gap: 10px; margin-bottom: 20px; }
        .tab-btn { flex: 1; padding: 10px; border: none; background: #e0e0e0; border-radius: 8px; cursor: pointer; font-weight: bold; transition: 0.3s; font-size: 12px; }
        .tab-btn.active { background: #3498db; color: white; }
        .section { display: none; }
        .section.active { display: block; }
        
        .search-container { display: flex; flex-direction: column; gap: 8px; margin-bottom: 15px; }
        .search-input-group { display: flex; gap: 6px; align-items: center; }
        input { flex: 1; padding: 10px; font-size: 13px; border: 2px solid #ddd; border-radius: 8px; outline: none; }
        .input-lang-select { padding: 8px; border-radius: 8px; border: 1px solid #ccc; font-size: 12px; font-weight: bold; background: #fafafa; }
        
        .icon-btn { background: #f0f0f0; border: 1px solid #ccc; padding: 8px 10px; border-radius: 8px; cursor: pointer; font-size: 16px; display: flex; align-items: center; justify-content: center; }
        .icon-btn:hover { background: #e0e0e0; }
        .icon-btn.listening { background: #e74c3c; color: white; animation: pulse 1s infinite; }
        
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        button.action-btn { background: #3498db; color: white; border: none; padding: 10px 12px; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 14px; }
        
        .speak-btn { background: #e74c3c; color: white; border: none; padding: 4px 8px; border-radius: 50%; cursor: pointer; font-size: 12px; margin-left: 6px; display: inline-flex; align-items: center; justify-content: center; }
        .speak-btn:hover { background: #c0392b; }

        .result-card { background: #f9f9f9; padding: 12px; border-radius: 10px; border-left: 4px solid #3498db; min-height: 90px; margin-bottom: 15px; }
        .ai-card { background: #f4ecf7; padding: 12px; border-radius: 10px; border-left: 4px solid #8e44ad; margin-top: 10px; font-size: 13px; color: #2c3e50; }
        .ai-header { font-weight: bold; color: #8e44ad; display: flex; align-items: center; gap: 5px; margin-bottom: 6px; font-size: 14px; }
        
        .quiz-card { background: #fff9c4; padding: 15px; border-radius: 10px; margin-bottom: 15px; text-align: center; }
        .quiz-title-eng { font-size: 12px; color: #795548; font-weight: bold; margin-bottom: 4px; display: block; }
        .options-grid { display: grid; gap: 8px; }
        
        .opt-wrapper { display: flex; align-items: center; gap: 6px; }
        .opt-btn { flex: 1; padding: 10px; background: white; border: 2px solid #fbc02d; border-radius: 8px; cursor: pointer; font-size: 15px; text-align: center; font-weight: bold; }
        .opt-btn:hover { background: #fffde7; }
    </style>
</head>
<body>

<div class="app-container">
    <div class="header">
        <span>🔥 ডিকুইজ অ্যাপ</span>
        <div class="stats">পয়েন্ট: <span id="score">0</span></div>
    </div>

    <!-- অনুবাদ প্রাপ্তির গন্তব্য ভাষা -->
    <div class="lang-bar">
        <label for="targetLang">অনুবাদ শুনবেন (Target):</label>
        <select id="targetLang" class="lang-select" onchange="changeLanguage()">
            <option value="en" selected>English</option>
            <option value="bn">Bangla (বাংলা)</option>
            <option value="ar">Arabic (العربية)</option>
            <option value="fr">French (Français)</option>
            <option value="de">German (Deutsch)</option>
            <option value="hi">Hindi (हिन्दी)</option>
            <option value="es">Spanish (Español)</option>
            <option value="ur">Urdu (উর্দু)</option>
        </select>
    </div>

    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('dict')">DICTIONARY (ডিকশনারি)</button>
        <button class="tab-btn" onclick="switchTab('quiz')">DAILY QUIZ (ডেইলি কুইজ)</button>
    </div>

    <div id="dictSection" class="section active">
        <div class="search-container">
            <div class="search-input-group">
                <input type="text" id="wordInput" placeholder="বাংলা বা যেকোনো ভাষায় লিখুন | Write in Bangla or any language">
                <!-- ইনপুট/ভয়েস ভাষা নির্বাচন -->
                <select id="inputLang" class="input-lang-select" title="লেখার ভাষা নির্বাচন করুন">
                    <option value="bn-BD" selected>🇧🇩 বাংলা (ডিফল্ট)</option>
                    <option value="en-US">🇺🇸 English</option>
                    <option value="ar-SA">🇸🇦 Arabic</option>
                    <option value="hi-IN">🇮🇳 Hindi</option>
                    <option value="auto">🌐 Auto Detect</option>
                </select>
            </div>
            <div class="search-input-group">
                <button id="micBtn" class="icon-btn" onclick="startVoiceSearch()" title="ভয়েস ইনপুট">🎙️ কথা বলুন</button>
                <button class="icon-btn" onclick="document.getElementById('imageInput').click()" title="ছবি থেকে সার্চ">📷 স্ক্যান</button>
                <input type="file" id="imageInput" accept="image/*" style="display: none;" onchange="processImageSearch(event)">
                <button class="action-btn" style="flex:1;" onclick="searchWord()">খুঁজুন</button>
            </div>
        </div>
        <div id="resultContainer" class="result-card">
            <p style="color: #888; text-align: center; font-size: 14px;">বাংলা বা যেকোনো ভাষা লিখলে অনুবাদ ও নিখুঁত উচ্চারণ শুনতে পাবেন</p>
        </div>
    </div>

    <div id="quizSection" class="section">
        <div class="quiz-card">
            <span id="quizQuestionEng" class="quiz-title-eng">What is the correct meaning?</span>
            <div style="display: flex; align-items: center; justify-content: center;">
                <p id="quizQuestion" style="font-weight: bold; font-size: 16px; margin: 0;">লোডিং...</p>
                <button class="speak-btn" onclick="speakCurrentQuestion()" title="উচ্চারণ শুনুন">🔊</button>
            </div>
        </div>
        <div class="options-grid" id="optionsContainer"></div>
        <p id="quizFeedback" style="text-align: center; margin-top: 10px; font-weight: bold;"></p>
    </div>
</div>

<script>
    let userScore = 0;
    let currentQuizIndex = 0;
    let wordDatabase = [];
    let quizQuestions = [];
    let currentLang = 'en';

    function changeLanguage() {
        currentLang = document.getElementById('targetLang').value;
        const resultContainer = document.getElementById('resultContainer');
        resultContainer.innerHTML = '<p style="color: #888; text-align: center; font-size: 14px;">অনুবাদক ভাষা পরিবর্তন করা হয়েছে। আবার সার্চ করুন!</p>';
        generateQuizFromDatabase();
        if (document.getElementById('quizSection').classList.contains('active')) {
            loadQuiz();
        }
    }

    function speakText(text, langCode = 'en-US') {
        if ('speechSynthesis' in window) {
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = langCode;
            utterance.rate = 0.9;
            window.speechSynthesis.speak(utterance);
        } else {
            alert("আপনার ব্রাউজারে স্পিচ সাপোর্ট নেই!");
        }
    }

    function speakCurrentQuestion() {
        const quiz = quizQuestions[currentQuizIndex];
        if (quiz) {
            speakText(quiz.rawWord, 'en-US');
        }
    }

    function startVoiceSearch() {
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        const resultContainer = document.getElementById('resultContainer');
        const micBtn = document.getElementById('micBtn');
        const wordInput = document.getElementById('wordInput');
        const inputLang = document.getElementById('inputLang').value;
        
        if (!SpeechRecognition) {
            alert("আপনার ব্রাউজারে ভয়েস সাপোর্ট করে না। Google Chrome ব্যবহার করুন।");
            return;
        }

        const recognition = new SpeechRecognition();
        recognition.lang = inputLang === 'auto' ? 'bn-BD' : inputLang;
        recognition.interimResults = false;

        micBtn.classList.add('listening');
        resultContainer.innerHTML = '<p style="text-align: center; color: #e74c3c; font-weight: bold;">🎙️ শুনছি... মুখে বলুন</p>';

        recognition.start();

        recognition.onresult = function(event) {
            micBtn.classList.remove('listening');
            const transcript = event.results[0][0].transcript;
            wordInput.value = transcript;
            searchWord();
        };

        recognition.onspeechend = function() {
            recognition.stop();
            micBtn.classList.remove('listening');
        };

        recognition.onerror = function() {
            micBtn.classList.remove('listening');
            resultContainer.innerHTML = '<p style="color: red; text-align: center;">কথা বোঝা যায়নি। আবার চেষ্টা করুন!</p>';
        };
    }

    function preprocessImage(file) {
        return new Promise((resolve) => {
            const img = new Image();
            img.src = URL.createObjectURL(file);
            img.onload = () => {
                const canvas = document.createElement('canvas');
                const ctx = canvas.getContext('2d');
                
                const maxWidth = 1000;
                let scale = 1;
                if (img.width > maxWidth) {
                    scale = maxWidth / img.width;
                }
                
                canvas.width = img.width * scale;
                canvas.height = img.height * scale;
                
                ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                resolve(canvas.toDataURL('image/jpeg', 0.8));
            };
        });
    }

    async function processImageSearch(event) {
        const file = event.target.files[0];
        const resultContainer = document.getElementById('resultContainer');
        const wordInput = document.getElementById('wordInput');
        
        if (!file) return;

        resultContainer.innerHTML = '<p style="text-align: center; color: #3498db; font-weight: bold;">🔍 ছবি বিশ্লেষণ করা হচ্ছে...</p>';

        try {
            const optimizedImageData = await preprocessImage(file);

            const worker = await Tesseract.createWorker('ben+eng');
            const ret = await worker.recognize(optimizedImageData);
            await worker.terminate();

            let cleanedText = ret.data.text.trim();

            if (cleanedText) {
                wordInput.value = cleanedText;
                searchWord();
            } else {
                resultContainer.innerHTML = '<p style="color: red; text-align: center;">ছবিতে কোনো স্পষ্ট লেখা পাওয়া যায়নি!</p>';
            }
        } catch (error) {
            console.error("OCR Error:", error);
            resultContainer.innerHTML = '<p style="color: red; text-align: center;">ছবি প্রসেস করতে সমস্যা হয়েছে!</p>';
        }
    }

    function playSound(type) {
        try {
            const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            if (type === 'correct') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(587.33, audioCtx.currentTime);
                osc.frequency.setValueAtTime(880, audioCtx.currentTime + 0.1);
                gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.3);
            } else if (type === 'wrong') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(150, audioCtx.currentTime);
                osc.frequency.setValueAtTime(100, audioCtx.currentTime + 0.1);
                gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.3);
            }
        } catch (e) {
            console.log("Audio error:", e);
        }
    }

    async function loadWordsData() {
        try {
            const response = await fetch('./words.json');
            wordDatabase = await response.json();
            generateQuizFromDatabase();
        } catch (error) {
            console.error("Data loading error:", error);
        }
    }

    async function fetchUniversalTranslation(text, targetLang) {
        try {
            const apiUrl = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=auto&tl=${targetLang}&dt=t&dj=1&q=${encodeURIComponent(text)}`;
            const response = await fetch(apiUrl);
            const data = await response.json();

            if (data && data.sentences && data.sentences.length > 0) {
                const translatedText = data.sentences.map(s => s.trans).join('');
                const detectedLang = data.src || 'auto';
                
                if (detectedLang === targetLang) {
                    const fallbackLang = targetLang === 'bn' ? 'en' : 'bn';
                    return await fetchUniversalTranslation(text, fallbackLang);
                }

                return {
                    translatedText: translatedText,
                    srcLang: detectedLang
                };
            }
        } catch (error) {
            console.error("Translation API error:", error);
        }
        return null;
    }

    async function fetchDictionaryDetails(word) {
        try {
            const res = await fetch(`https://api.dictionaryapi.dev/api/v2/entries/en/${encodeURIComponent(word)}`);
            if (res.ok) {
                const data = await res.json();
                return data[0];
            }
        } catch (e) {
            console.error("Dict API Error:", e);
        }
        return null;
    }

    async function searchWord() {
        const textInput = document.getElementById('wordInput').value.trim();
        const resultContainer = document.getElementById('resultContainer');

        if (!textInput) {
            resultContainer.innerHTML = '<p style="color: red; text-align: center;">দয়া করে কোনো শব্দ বা বাক্য লিখুন!</p>';
            return;
        }

        resultContainer.innerHTML = '<p style="text-align: center; color: #3498db;">🔍 অনুবাদ ও উচ্চারণ প্রস্তুত হচ্ছে...</p>';

        const translationRes = await fetchUniversalTranslation(textInput, currentLang);

        if (!translationRes) {
            resultContainer.innerHTML = '<p style="color: red; text-align: center;">অনুবাদ পাওয়া যায়নি!</p>';
            return;
        }

        const isSingleWord = !textInput.includes(' ');
        let dictDetailHtml = '';
        let aiAnalysisHtml = '';

        if (isSingleWord) {
            let englishWord = textInput;
            if (translationRes.srcLang !== 'en') {
                const engRes = await fetchUniversalTranslation(textInput, 'en');
                if (engRes) englishWord = engRes.translatedText;
            }

            const dictData = await fetchDictionaryDetails(englishWord);

            if (dictData) {
                const partOfSpeech = dictData.meanings[0]?.partOfSpeech || 'word';
                const phonetic = dictData.phonetic || (dictData.phonetics.find(p => p.text)?.text) || '';
                let definition = dictData.meanings[0]?.definitions[0]?.definition || '';
                let example = dictData.meanings[0]?.definitions[0]?.example || '';

                if (definition && currentLang !== 'en') {
                    const transDef = await fetchUniversalTranslation(definition, currentLang);
                    if (transDef) definition = transDef.translatedText;
                }
                if (example && currentLang !== 'en') {
                    const transEx = await fetchUniversalTranslation(example, currentLang);
                    if (transEx) example = transEx.translatedText;
                }

                dictDetailHtml = `
                    <div style="margin-top: 8px; font-size: 13px; color: #555;">
                        <span><b>Part of Speech:</b> <i>${partOfSpeech}</i></span>
                        ${phonetic ? `<span style="margin-left: 10px; color: #e67e22;"><b>Phonetics:</b> ${phonetic}</span>` : ''}
                    </div>
                `;

                aiAnalysisHtml = `
                    <div class="ai-card">
                        <div class="ai-header">🤖 AI Grammar & Meaning (বিশ্লেষণ)</div>
                        <p style="margin-bottom: 5px;"><b>Definition:</b> ${definition}</p>
                        ${example ? `<p style="margin-bottom: 5px; color: #27ae60;"><b>Example:</b> "${example}"</p>` : ''}
                    </div>
                `;
            }
        }

        renderResult(textInput, translationRes.translatedText, translationRes.srcLang, currentLang, dictDetailHtml, aiAnalysisHtml);
    }

    function renderResult(original, translation, srcLang, targetLang, dictHtml = '', aiHtml = '') {
        const resultContainer = document.getElementById('resultContainer');
        
        const safeOriginal = original.replace(/'/g, "\\'");
        const safeTranslation = translation.replace(/'/g, "\\'");

        resultContainer.innerHTML = `
            <div style="font-size: 18px; font-weight: bold; color: #2c3e50; display: flex; align-items: center; flex-wrap: wrap;">
                ${original} 
                <button class="speak-btn" onclick="speakText('${safeOriginal}', '${srcLang}')" title="উচ্চারণ শুনুন">🔊</button>
                <span style="font-size: 11px; background: #2ecc71; color: white; padding: 2px 6px; border-radius: 4px; margin-left: 5px;">${srcLang.toUpperCase()} ➔ ${targetLang.toUpperCase()}</span>
            </div>
            ${dictHtml}
            <div style="font-size: 16px; color: #27ae60; margin-top: 8px; display: flex; align-items: center; flex-wrap: wrap;">
                <b>অনুবাদ:</b> ${translation}
                <button class="speak-btn" onclick="speakText('${safeTranslation}', '${targetLang}')" title="উচ্চারণ শুনুন">🔊</button>
            </div>
            ${aiHtml}
        `;
        userScore += 5;
        document.getElementById('score').innerText = userScore;
    }

    async function generateQuizFromDatabase() {
        if (wordDatabase.length < 3) return;

        const shuffled = [...wordDatabase].sort(() => 0.5 - Math.random()).slice(0, 5);
        
        quizQuestions = [];
        for (let item of shuffled) {
            let correctMeaning = item.meaning;
            let questionWord = item.word;

            const transRes = await fetchUniversalTranslation(item.word, currentLang);
            if (transRes) correctMeaning = transRes.translatedText;

            const otherWords = wordDatabase.filter(w => w.word !== item.word).sort(() => 0.5 - Math.random()).slice(0, 2);
            let wrongOption1 = otherWords[0].meaning;
            let wrongOption2 = otherWords[1].meaning;

            const trans1 = await fetchUniversalTranslation(otherWords[0].word, currentLang);
            const trans2 = await fetchUniversalTranslation(otherWords[1].word, currentLang);
            if (trans1) wrongOption1 = trans1.translatedText;
            if (trans2) wrongOption2 = trans2.translatedText;

            const options = [correctMeaning, wrongOption1, wrongOption2].sort(() => 0.5 - Math.random());

            quizQuestions.push({
                rawWord: questionWord,
                questionEng: `What is the correct meaning of '${questionWord.toUpperCase()}'?`,
                questionBn: `'${questionWord.toUpperCase()}' - এর সঠিক অর্থ কোনটি?`,
                options: options,
                correct: correctMeaning
            });
        }
    }

    function switchTab(tabName) {
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
        document.querySelectorAll('.section').forEach(sec => sec.classList.remove('active'));

        if (tabName === 'dict') {
            document.querySelectorAll('.tab-btn')[0].classList.add('active');
            document.getElementById('dictSection').classList.add('active');
        } else {
            document.querySelectorAll('.tab-btn')[1].classList.add('active');
            document.getElementById('quizSection').classList.add('active');
            loadQuiz();
        }
    }

    function loadQuiz() {
        if (quizQuestions.length === 0) {
            document.getElementById('quizQuestion').innerText = "কুইজ প্রস্তুত হচ্ছে...";
            generateQuizFromDatabase().then(() => loadQuiz());
            return;
        }

        const quiz = quizQuestions[currentQuizIndex];
        document.getElementById('quizQuestionEng').innerText = quiz.questionEng;
        document.getElementById('quizQuestion').innerText = quiz.questionBn;
        document.getElementById('quizFeedback').innerText = '';

        const optionsContainer = document.getElementById('optionsContainer');
        optionsContainer.innerHTML = '';

        quiz.options.forEach(opt => {
            const wrapper = document.createElement('div');
            wrapper.className = 'opt-wrapper';

            const btn = document.createElement('button');
            btn.className = 'opt-btn';
            btn.innerText = opt;
            btn.onclick = () => checkAnswer(opt);

            const audioBtn = document.createElement('button');
            audioBtn.className = 'speak-btn';
            audioBtn.innerHTML = '🔊';
            audioBtn.title = 'উচ্চারণ শুনুন';
            audioBtn.onclick = (e) => {
                e.stopPropagation();
                speakText(opt, currentLang);
            };

            wrapper.appendChild(btn);
            wrapper.appendChild(audioBtn);
            optionsContainer.appendChild(wrapper);
        });
    }

    function checkAnswer(selectedOption) {
        const feedback = document.getElementById('quizFeedback');
        const currentCorrect = quizQuestions[currentQuizIndex].correct;

        if (selectedOption === currentCorrect) {
            playSound('correct');
            feedback.style.color = 'green';
            feedback.innerText = 'Correct! / সঠিক উত্তর! 🎉 (+১০ পয়েন্ট)';
            userScore += 10;
            document.getElementById('score').innerText = userScore;

            setTimeout(() => {
                currentQuizIndex = (currentQuizIndex + 1) % quizQuestions.length;
                loadQuiz();
            }, 1000);
        } else {
            playSound('wrong');
            feedback.style.color = 'red';
            feedback.innerText = 'Wrong Answer! / ভুল উত্তর! আবার চেষ্টা করুন।';
        }
    }

    window.addEventListener('DOMContentLoaded', loadWordsData);

    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('./pwabuilder-sw.js')
                .then((reg) => console.log('Service Worker Registered:', reg))
                .catch((err) => console.error('SW Registration Failed:', err));
        });
    }
</script>

</body>
</html>
