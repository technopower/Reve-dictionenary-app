<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>শব্দকোষ ও কুইজ একাডেমি</title>

    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#2ecc71">
    <link rel="apple-touch-icon" href="assets/logos/index_logo.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="ডিকুইজ অ্যাপ">
    <link rel="icon" type="image/png" href="assets/logos/index_logo.png">

    <!-- Fast OCR Engine for Image Text Reading -->
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #f0f4f8; color: #333; padding: 15px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .app-container { background: #fff; padding: 20px; border-radius: 20px; box-shadow: 0 6px 20px rgba(0,0,0,0.1); width: 100%; max-width: 400px; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; background: #2ecc71; color: white; padding: 12px 15px; border-radius: 12px; }
        .stats { font-size: 14px; font-weight: bold; }
        
        .lang-bar { display: flex; align-items: center; justify-content: space-between; background: #e8f8f5; padding: 8px 12px; border-radius: 10px; margin-bottom: 15px; border: 1px solid #a3e4d7; }
        .lang-bar label { font-size: 13px; font-weight: bold; color: #16a085; }
        .lang-select { padding: 6px 10px; border-radius: 6px; border: 1px solid #16a085; font-size: 13px; font-weight: bold; outline: none; background: white; cursor: pointer; }

        .tabs { display: flex; gap: 10px; margin-bottom: 20px; }
        .tab-btn { flex: 1; padding: 10px; border: none; background: #e0e0e0; border-radius: 8px; cursor: pointer; font-weight: bold; transition: 0.3s; }
        .tab-btn.active { background: #3498db; color: white; }
        .section { display: none; }
        .section.active { display: block; }
        
        .search-box { display: flex; gap: 6px; margin-bottom: 15px; align-items: center; }
        input { flex: 1; padding: 10px; font-size: 14px; border: 2px solid #ddd; border-radius: 8px; outline: none; }
        .icon-btn { background: #f0f0f0; border: 1px solid #ccc; padding: 8px 10px; border-radius: 8px; cursor: pointer; font-size: 16px; display: flex; align-items: center; justify-content: center; }
        .icon-btn:hover { background: #e0e0e0; }
        .icon-btn.listening { background: #e74c3c; color: white; animation: pulse 1s infinite; }
        
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        button.action-btn { background: #3498db; color: white; border: none; padding: 10px 12px; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 14px; }
        
        /* Result & AI Analysis Styles */
        .result-card { background: #f9f9f9; padding: 12px; border-radius: 10px; border-left: 4px solid #3498db; min-height: 90px; margin-bottom: 15px; }
        .ai-card { background: #f4ecf7; padding: 12px; border-radius: 10px; border-left: 4px solid #8e44ad; margin-top: 10px; font-size: 13px; color: #2c3e50; }
        .ai-header { font-weight: bold; color: #8e44ad; display: flex; align-items: center; gap: 5px; margin-bottom: 6px; font-size: 14px; }
        
        .quiz-card { background: #fff9c4; padding: 15px; border-radius: 10px; margin-bottom: 15px; text-align: center; }
        .options-grid { display: grid; gap: 8px; }
        .opt-btn { padding: 10px; background: white; border: 2px solid #fbc02d; border-radius: 8px; cursor: pointer; font-size: 15px; text-align: center; font-weight: bold; }
        .opt-btn:hover { background: #fffde7; }
    </style>
</head>
<body>

<div class="app-container">
    <div class="header">
        <span>🔥 ডিকুইজ অ্যাপ</span>
        <div class="stats">পয়েন্ট: <span id="score">0</span></div>
    </div>

    <!-- হোমপেজে ভাষা নির্বাচন ড্রপডাউন -->
    <div class="lang-bar">
        <label for="targetLang">অনুবাদ ও কুইজের ভাষা:</label>
        <select id="targetLang" class="lang-select" onchange="changeLanguage()">
            <option value="bn" selected>Bangla (বাংলা)</option>
            <option value="ar">Arabic (العربية)</option>
            <option value="en">English</option>
            <option value="fr">French (Français)</option>
            <option value="de">German (Deutsch)</option>
            <option value="hi">Hindi (हिन्दी)</option>
            <option value="pt">Portuguese (Português)</option>
            <option value="es">Spanish (Español)</option>
            <option value="ru">Russian (Русский)</option>
            <option value="ur">Urdu (উর্দু)</option>
        </select>
    </div>

    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('dict')">ডিকশনারি</button>
        <button class="tab-btn" onclick="switchTab('quiz')">ডেইলি কুইজ</button>
    </div>

    <div id="dictSection" class="section active">
        <div class="search-box">
            <input type="text" id="wordInput" placeholder="শব্দ বা বাক্য লিখুন...">
            <button id="micBtn" class="icon-btn" onclick="startVoiceSearch()" title="ভয়েস ইনপুট">🎙️</button>
            <button class="icon-btn" onclick="document.getElementById('imageInput').click()" title="ছবি থেকে সার্চ">📷</button>
            <input type="file" id="imageInput" accept="image/*" style="display: none;" onchange="processImageSearch(event)">
            <button class="action-btn" onclick="searchWord()">খুঁজুন</button>
        </div>
        <div id="resultContainer" class="result-card">
            <p style="color: #888; text-align: center; font-size: 14px;">অর্থ দেখতে সার্চ, ভয়েস বা ছবি ব্যবহার করুন</p>
        </div>
    </div>

    <div id="quizSection" class="section">
        <div class="quiz-card">
            <p id="quizQuestion" style="font-weight: bold; margin-bottom: 10px;">লোডিং...</p>
        </div>
        <div class="options-grid" id="optionsContainer"></div>
        <p id="quizFeedback" style="text-align: center; margin-top: 10px; font-weight: bold;"></p>
    </div>
</div>

<script>
    let userScore = 0;
    let currentQuizIndex = 0;
    let wordDatabase = [];
    let quizQuestions = [];
    let currentLang = 'bn';

    function changeLanguage() {
        currentLang = document.getElementById('targetLang').value;
        const resultContainer = document.getElementById('resultContainer');
        resultContainer.innerHTML = '<p style="color: #888; text-align: center; font-size: 14px;">ভাষা পরিবর্তন করা হয়েছে। নতুন সার্চ করুন!</p>';
        generateQuizFromDatabase();
        if (document.getElementById('quizSection').classList.contains('active')) {
            loadQuiz();
        }
    }

    function startVoiceSearch() {
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        const resultContainer = document.getElementById('resultContainer');
        const micBtn = document.getElementById('micBtn');
        const wordInput = document.getElementById('wordInput');
        
        if (!SpeechRecognition) {
            alert("আপনার ব্রাউজারে ভয়েস সাপোর্ট করে না। Google Chrome ব্যবহার করুন।");
            return;
        }

        const recognition = new SpeechRecognition();
        recognition.lang = 'en-US';
        recognition.interimResults = false;

        micBtn.classList.add('listening');
        resultContainer.innerHTML = '<p style="text-align: center; color: #e74c3c; font-weight: bold;">🎙️ শুনছি... এখন কথা বলুন</p>';

        recognition.start();

        recognition.onresult = function(event) {
            micBtn.classList.remove('listening');
            const transcript = event.results[0][0].transcript;
            wordInput.value = transcript;
            searchWord();
        };

        recognition.onspeechend = function() {
            recognition.stop();
            micBtn.classList.remove('listening');
        };

        recognition.onerror = function() {
            micBtn.classList.remove('listening');
            resultContainer.innerHTML = '<p style="color: red; text-align: center;">কথা বোঝা যায়নি। আবার চেষ্টা করুন!</p>';
        };
    }

    function preprocessImage(file) {
        return new Promise((resolve) => {
            const img = new Image();
            img.src = URL.createObjectURL(file);
            img.onload = () => {
                const canvas = document.createElement('canvas');
                const ctx = canvas.getContext('2d');
                
                const maxWidth = 1000;
                let scale = 1;
                if (img.width > maxWidth) {
                    scale = maxWidth / img.width;
                }
                
                canvas.width = img.width * scale;
                canvas.height = img.height * scale;
                
                ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                resolve(canvas.toDataURL('image/jpeg', 0.8));
            };
        });
    }

    async function processImageSearch(event) {
        const file = event.target.files[0];
        const resultContainer = document.getElementById('resultContainer');
        const wordInput = document.getElementById('wordInput');
        
        if (!file) return;

        resultContainer.innerHTML = '<p style="text-align: center; color: #3498db; font-weight: bold;">🔍 ছবি বিশ্লেষণ করা হচ্ছে...</p>';

        try {
            const optimizedImageData = await preprocessImage(file);

            const worker = await Tesseract.createWorker('eng');
            const ret = await worker.recognize(optimizedImageData);
            await worker.terminate();

            let cleanedText = ret.data.text
                .replace(/[^a-zA-Z0-9\s]/g, ' ')
                .replace(/\s+/g, ' ')
                .trim();

            if (cleanedText) {
                wordInput.value = cleanedText;
                searchWord();
            } else {
                resultContainer.innerHTML = '<p style="color: red; text-align: center;">ছবিতে কোনো স্পষ্ট ইংরেজি শব্দ পাওয়া যায়নি!</p>';
            }
        } catch (error) {
            console.error("OCR Error:", error);
            resultContainer.innerHTML = '<p style="color: red; text-align: center;">ছবি প্রসেস করতে সমস্যা হয়েছে!</p>';
        }
    }

    function playSound(type) {
        try {
            const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            if (type === 'correct') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(587.33, audioCtx.currentTime);
                osc.frequency.setValueAtTime(880, audioCtx.currentTime + 0.1);
                gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.3);
            } else if (type === 'wrong') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(150, audioCtx.currentTime);
                osc.frequency.setValueAtTime(100, audioCtx.currentTime + 0.1);
                gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.3);
            }
        } catch (e) {
            console.log("Audio error:", e);
        }
    }

    async function loadWordsData() {
        try {
            const response = await fetch('./words.json');
            wordDatabase = await response.json();
            generateQuizFromDatabase();
        } catch (error) {
            console.error("Data loading error:", error);
        }
    }

    async function fetchTranslation(text, targetLanguage) {
        try {
            const apiUrl = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=auto&tl=${targetLanguage}&dt=t&dj=1&q=${encodeURIComponent(text)}`;
            const response = await fetch(apiUrl);
            const data = await response.json();

            if (data && data.sentences && data.sentences.length > 0) {
                return data.sentences.map(s => s.trans).join('');
            }
        } catch (error) {
            console.error("Translation API error:", error);
        }
        return null;
    }

    // ফ্রি ডিকশনারি API (Word Details, Phonetic, Part of Speech-এর জন্য)
    async function fetchDictionaryDetails(word) {
        try {
            const res = await fetch(`https://api.dictionaryapi.dev/api/v2/entries/en/${encodeURIComponent(word)}`);
            if (res.ok) {
                const data = await res.json();
                return data[0];
            }
        } catch (e) {
            console.error("Dict API Error:", e);
        }
        return null;
    }

    async function searchWord() {
        const textInput = document.getElementById('wordInput').value.trim();
        const resultContainer = document.getElementById('resultContainer');

        if (!textInput) {
            resultContainer.innerHTML = '<p style="color: red; text-align: center;">দয়া করে একটি শব্দ বা বাক্য লিখুন!</p>';
            return;
        }

        resultContainer.innerHTML = '<p style="text-align: center; color: #3498db;">🔍 শব্দ বিশ্লেষণ করা হচ্ছে...</p>';

        const cleanInput = textInput.toLowerCase();
        const isSingleWord = !textInput.includes(' ');

        // মূল অনুবাদ বের করা
        let mainTranslation = await fetchTranslation(textInput, currentLang);
        if (!mainTranslation && currentLang === 'bn' && isSingleWord) {
            const found = wordDatabase.find(item => item.word.toLowerCase() === cleanInput);
            if (found) mainTranslation = found.meaning;
        }

        if (!mainTranslation) {
            resultContainer.innerHTML = '<p style="color: red; text-align: center;">অনুবাদ পাওয়া যায়নি!</p>';
            return;
        }

        let dictDetailHtml = '';
        let aiAnalysisHtml = '';

        if (isSingleWord) {
            const dictData = await fetchDictionaryDetails(cleanInput);

            if (dictData) {
                const partOfSpeech = dictData.meanings[0]?.partOfSpeech || 'word';
                const phonetic = dictData.phonetic || (dictData.phonetics.find(p => p.text)?.text) || '';
                const definition = dictData.meanings[0]?.definitions[0]?.definition || '';
                const example = dictData.meanings[0]?.definitions[0]?.example || '';

                dictDetailHtml = `
                    <div style="margin-top: 8px; font-size: 13px; color: #555;">
                        <span><b>পদ (Part of Speech):</b> <i>${partOfSpeech}</i></span>
                        ${phonetic ? `<span style="margin-left: 10px; color: #e67e22;"><b>উচ্চারণ:</b> ${phonetic}</span>` : ''}
                    </div>
                `;

                // AI স্মার্ট বিশ্লেষণ কার্ড তৈরি
                aiAnalysisHtml = `
                    <div class="ai-card">
                        <div class="ai-header">🤖 AI ব্যাকরণ ও সঠিক ব্যবহার বিশ্লেষণ</div>
                        <p style="margin-bottom: 5px;"><b>সংজ্ঞা (Definition):</b> ${definition}</p>
                        ${example ? `<p style="margin-bottom: 5px; color: #27ae60;"><b>উদাহরণ বাক্য:</b> "${example}"</p>` : ''}
                        <p style="color: #7f8c8d; font-size: 12px; margin-top: 5px;">💡 <i>টিপস: বাক্য গঠনে এই শব্দটির সঠিক অবস্থান লক্ষ্য রাখুন।</i></p>
                    </div>
                `;
            } else {
                aiAnalysisHtml = `
                    <div class="ai-card">
                        <div class="ai-header">🤖 AI বিশ্লেষণ</div>
                        <p>এটি একটি সাধারণ শব্দ। বাক্য গঠনে সঠিক ব্যাকরণ অনুসরণ করুন।</p>
                    </div>
                `;
            }
        }

        renderResult(textInput, mainTranslation, isSingleWord ? "Word" : "Sentence", dictDetailHtml, aiAnalysisHtml);
    }

    function renderResult(original, translation, tag, dictHtml = '', aiHtml = '') {
        const resultContainer = document.getElementById('resultContainer');
        resultContainer.innerHTML = `
            <div style="font-size: 18px; font-weight: bold; color: #2c3e50;">
                ${original} <span style="font-size: 11px; background: #2ecc71; color: white; padding: 2px 6px; border-radius: 4px; margin-left: 5px;">${tag}</span>
            </div>
            ${dictHtml}
            <div style="font-size: 16px; color: #27ae60; margin-top: 8px;"><b>অনুবাদ:</b> ${translation}</div>
            ${aiHtml}
        `;
        userScore += 5;
        document.getElementById('score').innerText = userScore;
    }

    async function generateQuizFromDatabase() {
        if (wordDatabase.length < 3) return;

        const shuffled = [...wordDatabase].sort(() => 0.5 - Math.random()).slice(0, 5);
        
        quizQuestions = [];
        for (let item of shuffled) {
            let correctMeaning = item.meaning;
            
            if (currentLang !== 'bn') {
                const trans = await fetchTranslation(item.word, currentLang);
                if (trans) correctMeaning = trans;
            }

            const otherWords = wordDatabase.filter(w => w.word !== item.word).sort(() => 0.5 - Math.random()).slice(0, 2);
            let wrongOption1 = otherWords[0].meaning;
            let wrongOption2 = otherWords[1].meaning;

            if (currentLang !== 'bn') {
                const trans1 = await fetchTranslation(otherWords[0].word, currentLang);
                const trans2 = await fetchTranslation(otherWords[1].word, currentLang);
                if (trans1) wrongOption1 = trans1;
                if (trans2) wrongOption2 = trans2;
            }

            const options = [correctMeaning, wrongOption1, wrongOption2].sort(() => 0.5 - Math.random());

            quizQuestions.push({
                question: `'${item.word.toUpperCase()}' - এর সঠিক অর্থ কোনটি?`,
                options: options,
                correct: correctMeaning
            });
        }
    }

    function switchTab(tabName) {
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
        document.querySelectorAll('.section').forEach(sec => sec.classList.remove('active'));

        if (tabName === 'dict') {
            document.querySelectorAll('.tab-btn')[0].classList.add('active');
            document.getElementById('dictSection').classList.add('active');
        } else {
            document.querySelectorAll('.tab-btn')[1].classList.add('active');
            document.getElementById('quizSection').classList.add('active');
            loadQuiz();
        }
    }

    function loadQuiz() {
        if (quizQuestions.length === 0) {
            document.getElementById('quizQuestion').innerText = "কুইজ প্রস্তুত হচ্ছে...";
            generateQuizFromDatabase().then(() => loadQuiz());
            return;
        }

        const quiz = quizQuestions[currentQuizIndex];
        document.getElementById('quizQuestion').innerText = quiz.question;
        document.getElementById('quizFeedback').innerText = '';

        const optionsContainer = document.getElementById('optionsContainer');
        optionsContainer.innerHTML = '';

        quiz.options.forEach(opt => {
            const btn = document.createElement('button');
            btn.className = 'opt-btn';
            btn.innerText = opt;
            btn.onclick = () => checkAnswer(opt);
            optionsContainer.appendChild(btn);
        });
    }

    function checkAnswer(selectedOption) {
        const feedback = document.getElementById('quizFeedback');
        const currentCorrect = quizQuestions[currentQuizIndex].correct;

        if (selectedOption === currentCorrect) {
            playSound('correct');
            feedback.style.color = 'green';
            feedback.innerText = 'সঠিক উত্তর! 🎉 (+১০ পয়েন্ট)';
            userScore += 10;
            document.getElementById('score').innerText = userScore;

            setTimeout(() => {
                currentQuizIndex = (currentQuizIndex + 1) % quizQuestions.length;
                loadQuiz();
            }, 1000);
        } else {
            playSound('wrong');
            feedback.style.color = 'red';
            feedback.innerText = 'ভুল উত্তর! আবার চেষ্টা করুন।';
        }
    }

    window.addEventListener('DOMContentLoaded', loadWordsData);

    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('./pwabuilder-sw.js')
                .then((reg) => console.log('Service Worker Registered:', reg))
                .catch((err) => console.error('SW Registration Failed:', err));
        });
    }
</script>

</body>
</html>
